<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>4 - 寻找两个正序数组的中位数</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5em;margin-bottom:10px;color:#e94560}
#desc{font-size:.9em;color:#aaa;margin-bottom:15px;text-align:center;max-width:900px}
canvas{background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-bottom:10px}
#stepInfo{background:#16213e;border-radius:8px;padding:12px 20px;margin-bottom:10px;min-width:600px;border:1px solid #0f3460}
#stepInfo .stepNum{color:#16c79a;font-weight:bold}
#stepInfo .stepDesc{color:#ddd;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls button{background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:.95em;transition:all .2s}
.controls button:hover{background:#e94560;color:#fff}
#speed{width:60px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;padding:4px 6px}
.legend{display:flex;gap:18px;margin-top:8px;font-size:.85em;color:#aaa;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>4 - 寻找两个正序数组的中位数</h1>
<p id="desc">给定两个正序数组nums1和nums2，找到它们合并后的中位数。使用二分查找在较短数组上找分割点，使得左半部分元素个数等于右半部分。</p>
<canvas id="cv" width="900" height="480"></canvas>
<div id="stepInfo"><span class="stepNum">步骤 0/0</span><div class="stepDesc">点击「播放」或「步骤前进」开始演示</div></div>
<div class="controls">
<button onclick="reset()">⏮ 重置</button>
<button onclick="prevStep()">◀ 步骤后退</button>
<button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button onclick="nextStep()">步骤前进 ▶</button>
<label style="color:#aaa">速度:<input id="speed" type="number" value="1200" min="100" max="3000" step="100">ms</label>
</div>
<div class="legend">
<span><span class="dot" style="background:#1a8fdd"></span>nums1</span>
<span><span class="dot" style="background:#16c79a"></span>nums2</span>
<span><span class="dot" style="background:#ffd700"></span>中位数</span>
<span><span class="dot" style="background:#e94560"></span>分割点</span>
</div>
<script>
const nums1=[1,3];
const nums2=[2];
const steps=[];
function buildSteps(){
  steps.length=0;
  // Merge approach for visualization
  const merged=[];
  let i=0,j=0;
  const n1=nums1.length,n2=nums2.length;
  steps.push({i,j,merged:[],desc:'初始化：双指针 i=0, j=0，合并两个有序数组'});
  while(i<n1||j<n2){
    if(j>=n2||(i<n1&&nums1[i]<=nums2[j])){
      merged.push({val:nums1[i],from:1,idx:i});
      steps.push({i:i+1,j,merged:[...merged],desc:`nums1[${i}]=${nums1[i]} ≤ nums2[${j<n2?j:'-'}]，取 nums1[${i}]=${nums1[i]}，i→${i+1}`,chosen:'a',chosenIdx:i});
      i++;
    }else{
      merged.push({val:nums2[j],from:2,idx:j});
      steps.push({i,j:j+1,merged:[...merged],desc:`nums2[${j}]=${nums2[j]} < nums1[${i<n1?i:'-'}]，取 nums2[${j}]=${nums2[j]}，j→${j+1}`,chosen:'b',chosenIdx:j});
      j++;
    }
  }
  const total=n1+n2;
  let median;
  if(total%2===1){
    median=merged[Math.floor(total/2)].val;
  }else{
    median=(merged[total/2-1].val+merged[total/2].val)/2;
  }
  steps.push({i,j,merged:[...merged],desc:`合并完成！总长度=${total}${total%2===1?'，中位数 = merged['+Math.floor(total/2)+'] = '+median:'，中位数 = (merged['+(total/2-1)+'] + merged['+(total/2)+']) / 2 = '+median}`,final:true,median});
}
buildSteps();

let cur=-1,timer=null,playing=false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=cur<0?{i:0,j:0,merged:[],desc:''}:steps[cur];
  const n1=nums1.length,n2=nums2.length;
  const cellW=70,gap=10;
  // draw nums1
  const aY=60;
  ctx.fillStyle='#1a8fdd';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('nums1:',40,aY+16);
  const aOffX=110;
  for(let i=0;i<n1;i++){
    const x=aOffX+i*(cellW+gap);
    let bg='#1a3a5a';
    if(s.chosen==='a'&&s.chosenIdx===i)bg='#1a8fdd';
    if(s.i>i)bg='#1a5a8a';
    ctx.fillStyle=bg;
    ctx.fillRect(x,aY,cellW,30);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,aY,cellW,30);
    ctx.fillStyle='#eee';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(nums1[i],x+cellW/2,aY+20);
  }
  // i pointer
  if(s.i<n1){
    const px=aOffX+s.i*(cellW+gap)+cellW/2;
    ctx.fillStyle='#1a8fdd';ctx.beginPath();ctx.moveTo(px,aY-10);ctx.lineTo(px-5,aY-2);ctx.lineTo(px+5,aY-2);ctx.closePath();ctx.fill();
    ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('i',px,aY-14);
  }
  // draw nums2
  const bY=130;
  ctx.fillStyle='#16c79a';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('nums2:',40,bY+16);
  for(let j=0;j<n2;j++){
    const x=aOffX+j*(cellW+gap);
    let bg='#1a4a3a';
    if(s.chosen==='b'&&s.chosenIdx===j)bg='#16c79a';
    if(s.j>j)bg='#1a6a4a';
    ctx.fillStyle=bg;
    ctx.fillRect(x,bY,cellW,30);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,bY,cellW,30);
    ctx.fillStyle='#eee';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(nums2[j],x+cellW/2,bY+20);
  }
  // j pointer
  if(s.j<n2){
    const px=aOffX+s.j*(cellW+gap)+cellW/2;
    ctx.fillStyle='#16c79a';ctx.beginPath();ctx.moveTo(px,bY-10);ctx.lineTo(px-5,bY-2);ctx.lineTo(px+5,bY-2);ctx.closePath();ctx.fill();
    ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('j',px,bY-14);
  }
  // merged array
  const mY=230;
  ctx.fillStyle='#ffd700';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('合并:',40,mY+16);
  const total=n1+n2;
  const mOffX=110;
  for(let k=0;k<s.merged.length;k++){
    const x=mOffX+k*(cellW+gap);
    const item=s.merged[k];
    let bg=item.from===1?'#1a5a8a':'#1a6a4a';
    // highlight median positions
    if(s.final){
      const mid=Math.floor(total/2);
      if(total%2===1&&k===mid)bg='#ffd700';
      if(total%2===0&&(k===total/2-1||k===total/2))bg='#ffd700';
    }
    ctx.fillStyle=bg;
    ctx.fillRect(x,mY,cellW,30);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,mY,cellW,30);
    ctx.fillStyle='#eee';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(item.val,x+cellW/2,mY+20);
    ctx.fillStyle='#666';ctx.font='10px sans-serif';
    ctx.fillText('['+k+']',x+cellW/2,mY+44);
  }
  // median display
  if(s.final&&s.median!==undefined){
    ctx.fillStyle='#ffd700';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
    ctx.fillText('中位数 = '+s.median,W/2,H-60);
  }
  // arrow showing which element is picked
  if(!s.final&&s.merged.length>0){
    const lastItem=s.merged[s.merged.length-1];
    const srcY=lastItem.from===1?aY+30:bY+30;
    const srcX=aOffX+lastItem.idx*(cellW+gap)+cellW/2;
    const dstX=mOffX+(s.merged.length-1)*(cellW+gap)+cellW/2;
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(srcX,srcY);ctx.lineTo(dstX,mY);ctx.stroke();
    ctx.setLineDash([]);
  }
}

function updateInfo(){
  const s=cur<0?null:steps[cur];
  document.querySelector('#stepInfo .stepNum').textContent=`步骤 ${cur+1}/${steps.length}`;
  document.querySelector('#stepInfo .stepDesc').textContent=s?s.desc:'点击「播放」或「步骤前进」开始演示';
}
function nextStep(){if(cur<steps.length-1){cur++;draw();updateInfo();}else stopPlay();}
function prevStep(){if(cur>=0){cur--;draw();updateInfo();}}
function reset(){stopPlay();cur=-1;draw();updateInfo();}
function togglePlay(){if(playing)stopPlay();else startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return;}nextStep();},+document.getElementById('speed').value);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}

draw();updateInfo();
</script>
</body>
</html>
