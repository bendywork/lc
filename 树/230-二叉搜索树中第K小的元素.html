<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>230 - 二叉搜索树中第K小的元素</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;font-size:24px;margin-bottom:10px}
#canvas{border:1px solid #333;border-radius:8px;background:#16213e}
.controls{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.controls button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
.controls button:hover{background:#c73a52}
#stepInfo{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;min-height:80px;margin-top:10px}
#stepInfo h3{color:#16c79a;margin-bottom:6px}
#stepInfo p{line-height:1.6}
.highlight{color:#e94560;font-weight:bold}
#counterPanel{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;margin-top:10px}
#counterPanel h3{color:#16c79a;margin-bottom:6px}
.counter-display{font-size:24px;color:#16c79a;font-weight:bold}
#stackPanel{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;margin-top:10px}
#stackPanel h3{color:#16c79a;margin-bottom:6px}
.stack-items{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.stack-item{background:#0f3460;padding:4px 10px;border-radius:4px;color:#16c79a;font-size:13px}
.stack-item.active{background:#e94560;color:#fff}
#resultPanel{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;margin-top:10px}
#resultPanel h3{color:#16c79a;margin-bottom:6px}
.result-items{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.result-val{background:#0f3460;padding:4px 10px;border-radius:4px;color:#16c79a;font-size:13px}
.result-val.kth{background:#ffd700;color:#1a1a2e;font-weight:bold}
</style>
</head>
<body>
<h1>230 - 二叉搜索树中第K小的元素（K=3）</h1>
<canvas id="canvas" width="780" height="400"></canvas>
<div class="controls">
<button id="btnReset">⏮ 重置</button>
<button id="btnPrev">⏪ 步骤后退</button>
<button id="btnPlay">▶ 播放</button>
<button id="btnNext">步骤前进 ⏩</button>
</div>
<div id="stepInfo"><h3>步骤说明</h3><p>点击「播放」或「步骤前进」开始动画演示</p></div>
<div id="counterPanel"><h3>计数器（当前第 N 小）</h3><div class="counter-display" id="counterVal">0</div></div>
<div id="stackPanel"><h3>递归栈</h3><div class="stack-items" id="stackItems"></div></div>
<div id="resultPanel"><h3>中序遍历序列</h3><div class="result-items" id="resultItems"></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=780,H=400;const K=3;
const tree={val:5,left:{val:3,left:{val:2,left:null,right:null},right:{val:4,left:null,right:null}},right:{val:6,left:null,right:{val:7,left:null,right:null}}};
const nodePos={};
function assignPos(node,x,y,spread){
  if(!node)return;nodePos[node.val]={x,y};
  assignPos(node.left,x-spread,y+60,spread/2);
  assignPos(node.right,x+spread,y+60,spread/2);
}
assignPos(tree,390,50,150);
const steps=[];let count=0;let found=false;
function genSteps(node,stack){
  if(!node||found)return;
  stack.push(node.val);
  steps.push({type:'goLeft',val:node.val,count,desc:`到达节点 ${node.val}，向左子树深入`,stack:[...stack],found:false});
  genSteps(node.left,stack);
  count++;
  const isKth=count===K;
  if(isKth)found=true;
  steps.push({type:'visit',val:node.val,count,desc:`中序访问节点 ${node.val}，计数 = ${count}${isKth?' — 这是第 '+K+' 小的元素！':''}`,stack:[...stack],found:isKth});
  if(!found)genSteps(node.right,stack);
  if(!found){stack.pop();steps.push({type:'goRight',val:node.val,count,desc:`节点 ${node.val} 处理完毕，返回`,stack:[...stack],found:false});}
  else stack.pop();
}
genSteps(tree,[]);
let curStep=-1,playing=false,timer=null,visitedSet=new Set(),curCount=0,foundVal=null;
function rebuildState(){
  visitedSet=new Set();curCount=0;foundVal=null;
  for(let i=0;i<=curStep&&i<steps.length;i++){
    const s=steps[i];
    if(s.type==='visit'){visitedSet.add(s.val);curCount=s.count;if(s.found)foundVal=s.val;}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);drawEdges(tree);drawNodes(tree);
}
function drawEdges(node){
  if(!node)return;const p=nodePos[node.val];
  if(node.left){const q=nodePos[node.left.val];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();drawEdges(node.left);}
  if(node.right){const q=nodePos[node.right.val];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();drawEdges(node.right);}
}
function drawNodes(node){
  if(!node)return;const p=nodePos[node.val];const s=curStep>=0?steps[curStep]:null;
  const isCur=s&&s.val===node.val;const isKth=foundVal===node.val;const isVisited=visitedSet.has(node.val);
  ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);
  if(isKth){ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=20;}
  else if(isCur){ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=15;}
  else if(isVisited){ctx.fillStyle='#16c79a';ctx.shadowBlur=0;}
  else{ctx.fillStyle='#0f3460';ctx.shadowBlur=0;}
  ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=isKth?'#ffd700':isCur?'#e94560':isVisited?'#16c79a':'#444';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=isKth?'#1a1a2e':'#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(node.val,p.x,p.y);
  drawNodes(node.left);drawNodes(node.right);
}
function renderUI(){
  draw();const s=curStep>=0&&curStep<steps.length?steps[curStep]:null;
  const infoEl=document.getElementById('stepInfo');
  if(s){const tl={goLeft:'深入左子树',visit:'中序访问',goRight:'返回'};
  infoEl.innerHTML=`<h3>步骤 ${curStep+1} / ${steps.length} — <span class="highlight">${tl[s.type]||s.type}</span></h3><p>${s.desc}</p>`;}
  else infoEl.innerHTML=`<h3>步骤说明</h3><p>点击「播放」或「步骤前进」开始动画演示</p>`;
  document.getElementById('counterVal').textContent=curCount;
  const si=document.getElementById('stackItems');const stk=s?s.stack:[];
  si.innerHTML=stk.length?stk.map((v,i)=>`<span class="stack-item${i===stk.length-1?' active':''}">${v}</span>`).join(''):'<span style="color:#888">栈为空</span>';
  const ri=document.getElementById('resultItems');
  const visited=[];for(let i=0;i<=curStep&&i<steps.length;i++){if(steps[i].type==='visit')visited.push(steps[i].val);}
  ri.innerHTML=visited.map((v,i)=>`<span class="result-val${i+1===K?' kth':''}">${v}</span>`).join('');
}
function stepForward(){if(curStep<steps.length-1){curStep++;rebuildState();renderUI();}else stopPlay();}
function stepBack(){if(curStep>=0){curStep--;rebuildState();renderUI();}}
function resetAnim(){stopPlay();curStep=-1;rebuildState();renderUI();}
function startPlay(){if(playing)return;playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(curStep<steps.length-1)stepForward();else stopPlay();},800);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}
document.getElementById('btnPlay').onclick=()=>{if(playing)stopPlay();else startPlay();};
document.getElementById('btnNext').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btnPrev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btnReset').onclick=resetAnim;
renderUI();
</script>
</body>
</html>
