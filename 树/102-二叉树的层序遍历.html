<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>102 - 二叉树的层序遍历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;font-size:24px;margin-bottom:10px}
#canvas{border:1px solid #333;border-radius:8px;background:#16213e}
.controls{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.controls button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
.controls button:hover{background:#c73a52}
#stepInfo{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;min-height:80px;margin-top:10px}
#stepInfo h3{color:#16c79a;margin-bottom:6px}
#stepInfo p{line-height:1.6}
.highlight{color:#e94560;font-weight:bold}
#queuePanel{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;margin-top:10px}
#queuePanel h3{color:#16c79a;margin-bottom:6px}
.queue-items{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.queue-item{background:#0f3460;padding:4px 10px;border-radius:4px;color:#16c79a;font-size:13px}
.queue-item.active{background:#e94560;color:#fff}
#resultPanel{background:#16213e;border:1px solid #333;border-radius:8px;padding:14px;width:780px;margin-top:10px}
#resultPanel h3{color:#16c79a;margin-bottom:6px}
.level-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.level-label{color:#888;font-size:12px;min-width:50px}
.result-val{background:#16c79a;color:#1a1a2e;padding:4px 10px;border-radius:4px;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<h1>102 - 二叉树的层序遍历（BFS）</h1>
<canvas id="canvas" width="780" height="400"></canvas>
<div class="controls">
<button id="btnReset">⏮ 重置</button>
<button id="btnPrev">⏪ 步骤后退</button>
<button id="btnPlay">▶ 播放</button>
<button id="btnNext">步骤前进 ⏩</button>
</div>
<div id="stepInfo"><h3>步骤说明</h3><p>点击「播放」或「步骤前进」开始动画演示</p></div>
<div id="queuePanel"><h3>队列状态</h3><div class="queue-items" id="queueItems"></div></div>
<div id="resultPanel"><h3>层序结果</h3><div id="levelResults"></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=780,H=400;
const tree={val:3,left:{val:9,left:{val:4,left:null,right:null},right:{val:5,left:null,right:null}},right:{val:20,left:{val:15,left:null,right:null},right:{val:7,left:null,right:null}}};
const nodePos={};
function assignPos(node,x,y,spread){
  if(!node)return;
  nodePos[node.val]={x,y};
  assignPos(node.left,x-spread,y+60,spread/2);
  assignPos(node.right,x+spread,y+60,spread/2);
}
assignPos(tree,390,50,150);
const steps=[];
function genBFSSteps(root){
  if(!root)return;
  const queue=[root];
  steps.push({type:'enqueue',val:root.val,queue:queue.map(n=>n.val),level:0,desc:`根节点 ${root.val} 入队`,result:null});
  let level=0;
  while(queue.length){
    const size=queue.length;
    const levelVals=[];
    for(let i=0;i<size;i++){
      const node=queue.shift();
      levelVals.push(node.val);
      steps.push({type:'dequeue',val:node.val,queue:queue.map(n=>n.val),level,desc:`出队节点 ${node.val}（第 ${level+1} 层）`,result:null});
      if(node.left){queue.push(node.left);steps.push({type:'enqueue',val:node.left.val,queue:queue.map(n=>n.val),level,desc:`节点 ${node.val} 的左子节点 ${node.left.val} 入队`,result:null});}
      if(node.right){queue.push(node.right);steps.push({type:'enqueue',val:node.right.val,queue:queue.map(n=>n.val),level,desc:`节点 ${node.val} 的右子节点 ${node.right.val} 入队`,result:null});}
    }
    steps.push({type:'levelDone',val:null,queue:queue.map(n=>n.val),level,levelVals:[...levelVals],desc:`第 ${level+1} 层遍历完成：[${levelVals.join(', ')}]`,result:[...levelVals]});
    level++;
  }
}
genBFSSteps(tree);
let curStep=-1,playing=false,timer=null,visited=new Set(),levelResults=[],curLevel=0;
function rebuildState(){
  visited=new Set();levelResults=[];curLevel=0;
  for(let i=0;i<=curStep&&i<steps.length;i++){
    const s=steps[i];
    if(s.type==='dequeue')visited.add(s.val);
    if(s.type==='levelDone'&&s.result){levelResults.push({level:curLevel,vals:s.result});curLevel++;}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);drawEdges(tree);drawNodes(tree);
}
function drawEdges(node){
  if(!node)return;const p=nodePos[node.val];
  if(node.left){const q=nodePos[node.left.val];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();drawEdges(node.left);}
  if(node.right){const q=nodePos[node.right.val];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();drawEdges(node.right);}
}
function drawNodes(node){
  if(!node)return;const p=nodePos[node.val];const s=curStep>=0?steps[curStep]:null;const isCur=s&&s.val===node.val;const isVis=visited.has(node.val);
  ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);
  if(isCur){ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=15;}
  else if(isVis){ctx.fillStyle='#16c79a';ctx.shadowBlur=0;}
  else{ctx.fillStyle='#0f3460';ctx.shadowBlur=0;}
  ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=isCur?'#e94560':isVis?'#16c79a':'#444';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(node.val,p.x,p.y);
  drawNodes(node.left);drawNodes(node.right);
}
function renderUI(){
  draw();const s=curStep>=0&&curStep<steps.length?steps[curStep]:null;
  const infoEl=document.getElementById('stepInfo');
  if(s){const tl={enqueue:'入队',dequeue:'出队',levelDone:'层完成'};infoEl.innerHTML=`<h3>步骤 ${curStep+1} / ${steps.length} — <span class="highlight">${tl[s.type]}</span></h3><p>${s.desc}</p>`;}
  else infoEl.innerHTML=`<h3>步骤说明</h3><p>点击「播放」或「步骤前进」开始动画演示</p>`;
  const qi=document.getElementById('queueItems');const q=s?s.queue:[];
  qi.innerHTML=q.length?q.map(v=>`<span class="queue-item">${v}</span>`).join(''):'<span style="color:#888">队列为空</span>';
  const lr=document.getElementById('levelResults');
  lr.innerHTML=levelResults.map(l=>`<div class="level-row"><span class="level-label">第 ${l.level+1} 层:</span>${l.vals.map(v=>`<span class="result-val">${v}</span>`).join('')}</div>`).join('');
}
function stepForward(){if(curStep<steps.length-1){curStep++;rebuildState();renderUI();}else stopPlay();}
function stepBack(){if(curStep>=0){curStep--;rebuildState();renderUI();}}
function resetAnim(){stopPlay();curStep=-1;rebuildState();renderUI();}
function startPlay(){if(playing)return;playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(curStep<steps.length-1)stepForward();else stopPlay();},700);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}
document.getElementById('btnPlay').onclick=()=>{if(playing)stopPlay();else startPlay();};
document.getElementById('btnNext').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btnPrev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btnReset').onclick=resetAnim;
renderUI();
</script>
</body>
</html>
