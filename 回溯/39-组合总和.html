<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>39-组合总和</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:22px;margin-bottom:16px}
.container{display:flex;gap:20px;width:100%;max-width:1200px;flex-wrap:wrap}
.panel{background:#16213e;border-radius:12px;padding:16px;flex:1;min-width:300px}
.panel-title{color:#16c79a;font-size:16px;font-weight:bold;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
canvas{display:block;margin:0 auto;background:#0f3460;border-radius:8px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:#c73650;transform:scale(1.05)}
button:disabled{background:#555;cursor:not-allowed;transform:none}
.info-box{background:#0f3460;border-radius:8px;padding:12px;margin-top:12px;min-height:60px}
.step-info{color:#16c79a;font-size:14px;line-height:1.8}
.candidates-bar{display:flex;gap:8px;margin:12px 0}
.cand{background:#0f3460;border-radius:8px;padding:8px 14px;text-align:center;font-family:monospace;font-size:18px;color:#16c79a;border:2px solid transparent;transition:all .3s}
.cand.active{border-color:#e94560;color:#e94560}
.cand.used{border-color:#16c79a;background:#16c79a33}
.tracker{display:flex;gap:16px;margin-top:10px}
.tracker-item{background:#0f3460;border-radius:8px;padding:8px 14px;text-align:center}
.tracker-label{color:#aaa;font-size:11px}.tracker-val{color:#16c79a;font-size:20px;font-weight:bold;font-family:monospace}
.tracker-val.warn{color:#e94560}
.result-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.result-tag{background:#0f3460;color:#16c79a;padding:3px 10px;border-radius:4px;font-size:13px;font-family:monospace}
.result-tag.current{background:#e94560;color:#fff}
.path-display{background:#0f3460;border-radius:8px;padding:10px;margin-top:10px;font-family:monospace;color:#16c79a;min-height:30px}
.path-display .path-arrow{color:#e94560}
</style>
</head>
<body>
<h1>39 - 组合总和</h1>
<div class="container">
<div class="panel">
<div class="panel-title">DFS 回溯树</div>
<canvas id="treeCanvas" width="560" height="440"></canvas>
</div>
<div class="panel">
<div class="panel-title">候选数组 & 状态</div>
<div style="color:#aaa;font-size:13px">candidates = [2,3,6,7]，target = 7</div>
<div class="candidates-bar" id="candBar"></div>
<div class="tracker">
<div class="tracker-item"><div class="tracker-label">当前和</div><div class="tracker-val" id="curSum">0</div></div>
<div class="tracker-item"><div class="tracker-label">剩余目标</div><div class="tracker-val" id="remain">7</div></div>
<div class="tracker-item"><div class="tracker-label">当前路径</div><div class="path-display" id="pathDisp">[]</div></div>
</div>
<div style="margin-top:16px"><div style="color:#aaa;font-size:13px;margin-bottom:6px">有效组合:</div><div class="result-list" id="resultList"></div></div>
</div>
</div>
<div class="info-box" id="infoBox"><span class="step-info">点击 ▶播放 开始动画演示</span></div>
<div class="controls">
<button id="btnPlay" onclick="play()">▶播放</button>
<button id="btnPause" onclick="pause()" disabled>⏸暂停</button>
<button id="btnReset" onclick="reset()">⏮重置</button>
<button id="btnPrev" onclick="prevStep()" disabled>◀步骤后退</button>
<button id="btnNext" onclick="nextStep()" disabled>步骤前进▶</button>
<span id="stepCounter" style="color:#aaa;font-size:14px;line-height:36px;margin-left:10px">步骤: 0/0</span>
</div>
<script>
const CANDIDATES=[2,3,6,7];
const TARGET=7;
const canvas=document.getElementById('treeCanvas');
const ctx=canvas.getContext('2d');
let steps=[];let currentStep=0;let playing=false;let timer=null;

function buildCandBar(){
  const bar=document.getElementById('candBar');bar.innerHTML='';
  CANDIDATES.forEach(c=>{bar.innerHTML+=`<div class="cand" data-val="${c}">${c}</div>`;});
}
buildCandBar();

function generateSteps(){
  steps=[];
  const treeNodes=[];let nid=0;
  function dfs(remain,path,startIdx,parentId,depth){
    const id=nid++;
    const node={id,path:[...path],remain,startIdx,depth,children:[],isResult:false,isPrune:false};
    treeNodes.push(node);
    if(parentId!==null){const p=treeNodes.find(n=>n.id===parentId);if(p)p.children.push(id);}
    if(remain===0){
      node.isResult=true;
      steps.push({type:'found',path:[...path],remain:0,startIdx,nodes:[...treeNodes],nodeId:id,
        desc:`找到有效组合: [${path.join(',')}]，和 = ${TARGET}`});
      return;
    }
    if(remain<0){
      node.isPrune=true;
      steps.push({type:'prune',path:[...path],remain,startIdx,nodes:[...treeNodes],nodeId:id,
        desc:`剪枝：当前和 ${TARGET-remain} > 目标 ${TARGET}，回溯`});
      return;
    }
    for(let i=startIdx;i<CANDIDATES.length;i++){
      const c=CANDIDATES[i];
      steps.push({type:'pick',path:[...path,c],remain:remain-c,startIdx:i,nodes:[...treeNodes],nodeId:id,cand:c,candIdx:i,
        desc:`选择 candidates[${i}]=${c}，路径=[${[...path,c].join(',')}]，剩余目标=${remain-c}`});
      dfs(remain-c,[...path,c],i,id,depth+1);
    }
    steps.push({type:'backtrack',path:[...path],remain,startIdx,nodes:[...treeNodes],nodeId:id,
      desc:`回溯：从 startIdx=${startIdx} 返回，当前路径=[${path.join(',')}]`});
  }
  steps.push({type:'start',path:[],remain:TARGET,startIdx:0,nodes:[],nodeId:null,
    desc:`开始DFS，candidates=[${CANDIDATES}]，target=${TARGET}`});
  dfs(TARGET,[],0,null,0);
  steps.push({type:'done',path:[],remain:0,startIdx:0,nodes:[],nodeId:null,
    desc:`搜索完成，共找到 ${steps.filter(s=>s.type==='found').length} 个有效组合`});
}

function layoutNodes(nodes){
  const pos={};const leaves=[];
  function getLeaves(node){
    if(node.children.length===0){leaves.push(node.id);return;}
    node.children.forEach(cid=>{const c=nodes.find(n=>n.id===cid);if(c)getLeaves(c);});
  }
  if(nodes.length>0)getLeaves(nodes[0]);
  const lw=55;const tw=leaves.length*lw;const sx=Math.max(20,(560-tw)/2);
  const lm={};leaves.forEach((lid,i)=>lm[lid]=sx+i*lw+lw/2);
  function posN(node){
    if(node.children.length===0){pos[node.id]={x:lm[node.id]||280,y:35+node.depth*48};return pos[node.id].x;}
    let sum=0;node.children.forEach(cid=>{const c=nodes.find(n=>n.id===cid);if(c)sum+=posN(c);});
    const avg=sum/node.children.length;
    pos[node.id]={x:avg,y:35+node.depth*48};return avg;
  }
  if(nodes.length>0)posN(nodes[0]);return pos;
}

function drawTree(step){
  ctx.clearRect(0,0,560,440);
  if(!step||!step.nodes||step.nodes.length===0){ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);return;}
  const nodes=step.nodes;const pos=layoutNodes(nodes);
  nodes.forEach(node=>{
    const p=pos[node.id];if(!p)return;
    node.children.forEach(cid=>{const cp=pos[cid];if(!cp)return;
      const isOn=step.path&&node.path&&step.path.length>=node.path.length&&step.path.every((v,i)=>node.path[i]===v);
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(cp.x,cp.y);
      ctx.strokeStyle=isOn?'#16c79a':'#333';ctx.lineWidth=isOn?2:1;ctx.stroke();
    });
  });
  nodes.forEach(node=>{
    const p=pos[node.id];if(!p)return;
    const isCur=step.nodeId===node.id;
    const isOn=step.path&&node.path&&step.path.length>=node.path.length&&step.path.every((v,i)=>node.path[i]===v);
    const r=isCur?18:isOn?15:11;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=isCur?'#e94560':isOn?'#16c79a':node.isResult?'#16c79a88':node.isPrune?'#e9456088':'#16213e';
    ctx.fill();ctx.strokeStyle=isCur?'#e94560':isOn?'#16c79a':'#555';ctx.lineWidth=isCur?2.5:1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    const lbl=node.path.length?node.path[node.path.length-1]:'s';
    ctx.fillText(lbl,p.x,p.y);
  });
}

function updateUI(step){
  if(!step)return;
  document.querySelectorAll('.cand').forEach(el=>{el.classList.remove('active','used');});
  if(step.type==='pick'){
    document.querySelectorAll('.cand').forEach(el=>{if(el.dataset.val==step.cand)el.classList.add('active');});
  }
  const curSum=step.path?step.path.reduce((a,b)=>a+b,0):0;
  document.getElementById('curSum').textContent=curSum;
  const rem=step.remain!==undefined?step.remain:TARGET-curSum;
  const remEl=document.getElementById('remain');remEl.textContent=rem;remEl.className='tracker-val'+(rem<0?' warn':'');
  document.getElementById('pathDisp').textContent=step.path?`[${step.path.join(',')}]`:'[]';
  if(step.type==='found'){
    const rl=document.getElementById('resultList');
    const tag=document.createElement('span');tag.className='result-tag current';
    tag.textContent=`[${step.path.join(',')}]`;rl.appendChild(tag);
  }else{document.querySelectorAll('.result-tag.current').forEach(t=>t.classList.remove('current'));}
  document.getElementById('infoBox').innerHTML=`<span class="step-info">${step.desc}</span>`;
  drawTree(step);
  document.getElementById('stepCounter').textContent=`步骤: ${currentStep+1}/${steps.length}`;
}

function play(){if(currentStep>=steps.length-1)reset();playing=true;
  document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  document.getElementById('btnNext').disabled=true;document.getElementById('btnPrev').disabled=true;
  timer=setInterval(()=>{if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}else pause();},700);}
function pause(){playing=false;clearInterval(timer);
  document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true;
  document.getElementById('btnNext').disabled=currentStep>=steps.length-1;document.getElementById('btnPrev').disabled=currentStep<=0;}
function reset(){pause();currentStep=0;
  document.getElementById('resultList').innerHTML='';
  document.getElementById('curSum').textContent='0';document.getElementById('remain').textContent=TARGET;
  document.getElementById('pathDisp').textContent='[]';
  document.getElementById('infoBox').innerHTML='<span class="step-info">点击 ▶播放 开始动画演示</span>';
  ctx.clearRect(0,0,560,440);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);
  document.getElementById('stepCounter').textContent='步骤: 0/0';
  document.getElementById('btnPrev').disabled=true;document.getElementById('btnNext').disabled=false;
  generateSteps();}
function nextStep(){if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
function prevStep(){if(currentStep>0){currentStep--;
  document.getElementById('resultList').innerHTML='';
  for(let i=0;i<=currentStep;i++){if(steps[i].type==='found'){
    const tag=document.createElement('span');tag.className='result-tag';tag.textContent=`[${steps[i].path.join(',')}]`;
    document.getElementById('resultList').appendChild(tag);}}
  updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
generateSteps();ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);
</script>
</body>
</html>
