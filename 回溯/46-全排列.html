<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>46-全排列</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:22px;margin-bottom:16px}
.container{display:flex;gap:20px;width:100%;max-width:1200px;flex-wrap:wrap}
.panel{background:#16213e;border-radius:12px;padding:16px;flex:1;min-width:300px}
.panel-title{color:#16c79a;font-size:16px;font-weight:bold;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
canvas{display:block;margin:0 auto;background:#0f3460;border-radius:8px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:#c73650;transform:scale(1.05)}
button:disabled{background:#555;cursor:not-allowed;transform:none}
.info-box{background:#0f3460;border-radius:8px;padding:12px;margin-top:12px;min-height:60px}
.step-info{color:#16c79a;font-size:14px;line-height:1.8}
.array-bar{display:flex;gap:4px;margin:12px 0}
.arr-cell{width:44px;height:44px;background:#0f3460;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;font-family:monospace;color:#16c79a;border:2px solid transparent;transition:all .3s}
.arr-cell.fixed{border-color:#16c79a;background:#16c79a33}
.arr-cell.swapping{border-color:#e94560;background:#e9456033;color:#e94560}
.arr-cell.idx{border-color:#aaa}
.result-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.result-tag{background:#0f3460;color:#16c79a;padding:3px 10px;border-radius:4px;font-size:13px;font-family:monospace}
.result-tag.current{background:#e94560;color:#fff}
.depth-info{background:#0f3460;border-radius:8px;padding:10px;margin-top:10px;font-size:13px;color:#aaa;line-height:1.8}
</style>
</head>
<body>
<h1>46 - 全排列</h1>
<div class="container">
<div class="panel">
<div class="panel-title">递归树 (交换法)</div>
<canvas id="treeCanvas" width="560" height="460"></canvas>
</div>
<div class="panel">
<div class="panel-title">数组状态</div>
<div style="color:#aaa;font-size:13px">nums = [1, 2, 3]，生成所有排列</div>
<div class="array-bar" id="arrayBar"></div>
<div class="depth-info" id="depthInfo">递归深度: 0 | 当前固定位置: -</div>
<div style="margin-top:16px"><div style="color:#aaa;font-size:13px;margin-bottom:6px">所有排列:</div><div class="result-list" id="resultList"></div></div>
</div>
</div>
<div class="info-box" id="infoBox"><span class="step-info">点击 ▶播放 开始动画演示</span></div>
<div class="controls">
<button id="btnPlay" onclick="play()">▶播放</button>
<button id="btnPause" onclick="pause()" disabled>⏸暂停</button>
<button id="btnReset" onclick="reset()">⏮重置</button>
<button id="btnPrev" onclick="prevStep()" disabled>◀步骤后退</button>
<button id="btnNext" onclick="nextStep()" disabled>步骤前进▶</button>
<span id="stepCounter" style="color:#aaa;font-size:14px;line-height:36px;margin-left:10px">步骤: 0/0</span>
</div>
<script>
const NUMS=[1,2,3];
const canvas=document.getElementById('treeCanvas');
const ctx=canvas.getContext('2d');
let steps=[];let currentStep=0;let playing=false;let timer=null;

function buildArrayBar(arr,depth,swapI,swapJ){
  const bar=document.getElementById('arrayBar');bar.innerHTML='';
  arr.forEach((v,i)=>{
    const cls=i<depth?'fixed':(i===swapI||i===swapJ?'swapping':'');
    bar.innerHTML+=`<div class="arr-cell ${cls}">${v}</div>`;
  });
  document.getElementById('depthInfo').innerHTML=`递归深度: ${depth} | 当前固定位置: ${depth>0?'[0..'+(depth-1)+']':'无'}${swapI>=0?' | 交换 ['+swapI+']↔['+swapJ+']':''}`;
}

function generateSteps(){
  steps=[];
  const treeNodes=[];let nid=0;
  function dfs(arr,depth,parentId){
    const id=nid++;
    const node={id,arr:[...arr],depth,children:[],isResult:false};
    treeNodes.push(node);
    if(parentId!==null){const p=treeNodes.find(n=>n.id===parentId);if(p)p.children.push(id);}
    if(depth===arr.length){
      node.isResult=true;
      steps.push({type:'result',arr:[...arr],depth,nodes:[...treeNodes],nodeId:id,swapI:-1,swapJ:-1,
        desc:`排列完成: [${arr.join(', ')}]`});
      return;
    }
    for(let i=depth;i<arr.length;i++){
      const newArr=[...arr];
      [newArr[depth],newArr[i]]=[newArr[i],newArr[depth]];
      steps.push({type:'swap',arr:[...newArr],depth,nodes:[...treeNodes],nodeId:id,swapI:depth,swapJ:i,
        desc:`交换 arr[${depth}]=${arr[depth]} ↔ arr[${i}]=${arr[i]}，得到 [${newArr.join(', ')}]`});
      dfs(newArr,depth+1,id);
      steps.push({type:'swap_back',arr:[...arr],depth,nodes:[...treeNodes],nodeId:id,swapI:depth,swapJ:i,
        desc:`换回 arr[${depth}] ↔ arr[${i}]，恢复 [${arr.join(', ')}]`});
    }
  }
  steps.push({type:'start',arr:[...NUMS],depth:0,nodes:[],nodeId:null,swapI:-1,swapJ:-1,
    desc:`开始全排列，nums=[${NUMS.join(', ')}]`});
  dfs([...NUMS],0,null);
  steps.push({type:'done',arr:[...NUMS],depth:0,nodes:[],nodeId:null,swapI:-1,swapJ:-1,
    desc:`全排列完成，共 ${steps.filter(s=>s.type==='result').length} 种排列`});
}

function layoutNodes(nodes){
  const pos={};const leaves=[];
  function getLeaves(node){
    if(node.children.length===0){leaves.push(node.id);return;}
    node.children.forEach(cid=>{const c=nodes.find(n=>n.id===cid);if(c)getLeaves(c);});
  }
  if(nodes.length>0)getLeaves(nodes[0]);
  const lw=55;const tw=leaves.length*lw;const sx=Math.max(20,(560-tw)/2);
  const lm={};leaves.forEach((lid,i)=>lm[lid]=sx+i*lw+lw/2);
  function posN(node){
    if(node.children.length===0){pos[node.id]={x:lm[node.id]||280,y:30+node.depth*60};return pos[node.id].x;}
    let sum=0;node.children.forEach(cid=>{const c=nodes.find(n=>n.id===cid);if(c)sum+=posN(c);});
    const avg=sum/node.children.length;
    pos[node.id]={x:avg,y:30+node.depth*60};return avg;
  }
  if(nodes.length>0)posN(nodes[0]);return pos;
}

function drawTree(step){
  ctx.clearRect(0,0,560,460);
  if(!step||!step.nodes||step.nodes.length===0){ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);return;}
  const nodes=step.nodes;const pos=layoutNodes(nodes);
  nodes.forEach(node=>{
    const p=pos[node.id];if(!p)return;
    node.children.forEach(cid=>{const cp=pos[cid];if(!cp)return;
      const isOn=step.arr&&node.arr&&step.depth>=node.depth;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(cp.x,cp.y);
      ctx.strokeStyle=isOn?'#16c79a':'#333';ctx.lineWidth=isOn?1.5:1;ctx.stroke();
    });
  });
  nodes.forEach(node=>{
    const p=pos[node.id];if(!p)return;
    const isCur=step.nodeId===node.id;
    const isOn=step.arr&&node.arr&&step.depth>node.depth;
    const r=isCur?20:isOn?16:12;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=isCur?'#e94560':isOn?'#16c79a':node.isResult?'#16c79a88':'#16213e';
    ctx.fill();ctx.strokeStyle=isCur?'#e94560':isOn?'#16c79a':'#555';ctx.lineWidth=isCur?2.5:1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`[${node.arr.join(',')}]`,p.x,p.y);
  });
}

function updateUI(step){
  if(!step)return;
  buildArrayBar(step.arr,step.depth,step.swapI,step.swapJ);
  if(step.type==='result'){
    const rl=document.getElementById('resultList');
    const tag=document.createElement('span');tag.className='result-tag current';
    tag.textContent=`[${step.arr.join(',')}]`;rl.appendChild(tag);
  }else{document.querySelectorAll('.result-tag.current').forEach(t=>t.classList.remove('current'));}
  document.getElementById('infoBox').innerHTML=`<span class="step-info">${step.desc}</span>`;
  drawTree(step);
  document.getElementById('stepCounter').textContent=`步骤: ${currentStep+1}/${steps.length}`;
}

function play(){if(currentStep>=steps.length-1)reset();playing=true;
  document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  document.getElementById('btnNext').disabled=true;document.getElementById('btnPrev').disabled=true;
  timer=setInterval(()=>{if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}else pause();},600);}
function pause(){playing=false;clearInterval(timer);
  document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true;
  document.getElementById('btnNext').disabled=currentStep>=steps.length-1;document.getElementById('btnPrev').disabled=currentStep<=0;}
function reset(){pause();currentStep=0;
  document.getElementById('resultList').innerHTML='';
  document.getElementById('infoBox').innerHTML='<span class="step-info">点击 ▶播放 开始动画演示</span>';
  buildArrayBar(NUMS,0,-1,-1);
  ctx.clearRect(0,0,560,460);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);
  document.getElementById('stepCounter').textContent='步骤: 0/0';
  document.getElementById('btnPrev').disabled=true;document.getElementById('btnNext').disabled=false;
  generateSteps();}
function nextStep(){if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
function prevStep(){if(currentStep>0){currentStep--;
  document.getElementById('resultList').innerHTML='';
  for(let i=0;i<=currentStep;i++){if(steps[i].type==='result'){
    const tag=document.createElement('span');tag.className='result-tag';tag.textContent=`[${steps[i].arr.join(',')}]`;
    document.getElementById('resultList').appendChild(tag);}}
  updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
generateSteps();buildArrayBar(NUMS,0,-1,-1);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',220,200);
</script>
</body>
</html>
