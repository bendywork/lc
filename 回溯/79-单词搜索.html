<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>79-单词搜索</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:22px;margin-bottom:16px}
.container{display:flex;gap:20px;width:100%;max-width:1200px;flex-wrap:wrap}
.panel{background:#16213e;border-radius:12px;padding:16px;flex:1;min-width:300px}
.panel-title{color:#16c79a;font-size:16px;font-weight:bold;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:#c73650;transform:scale(1.05)}
button:disabled{background:#555;cursor:not-allowed;transform:none}
.info-box{background:#0f3460;border-radius:8px;padding:12px;margin-top:12px;min-height:60px}
.step-info{color:#16c79a;font-size:14px;line-height:1.8}
.grid{display:inline-grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:3px;margin:10px auto}
.cell{width:60px;height:60px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;font-family:monospace;transition:all .3s;border:2px solid transparent}
.cell.empty{background:#0f3460;color:#aaa}
.cell.visited{background:#16c79a33;border-color:#16c79a;color:#16c79a}
.cell.current{background:#e9456033;border-color:#e94560;color:#e94560;animation:pulse 0.5s ease}
.cell.backtrack{background:#e9456011;border-color:#e9456044;color:#e9456044}
.cell.dead{background:#33333333;border-color:#333;color:#555}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.word-display{display:flex;gap:4px;margin:10px 0;justify-content:center}
.word-char{width:36px;height:36px;background:#0f3460;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;font-family:monospace;border:2px solid #333;transition:all .3s}
.word-char.matched{border-color:#16c79a;color:#16c79a;background:#16c79a22}
.word-char.current{border-color:#e94560;color:#e94560;background:#e9456022}
.word-char.pending{color:#555}
.dir-info{margin-top:10px;font-size:13px;color:#aaa}
.path-info{background:#0f3460;border-radius:8px;padding:8px;margin-top:8px;font-size:12px;color:#16c79a;font-family:monospace;min-height:24px}
.result-box{margin-top:12px;padding:10px;border-radius:8px;display:none}
.result-box.found{display:block;background:#16c79a22;border:1px solid #16c79a;color:#16c79a}
.result-box.not-found{display:block;background:#e9456022;border:1px solid #e94560;color:#e94560}
</style>
</head>
<body>
<h1>79 - 单词搜索</h1>
<div class="container">
<div class="panel">
<div class="panel-title">字母网格</div>
<div style="text-align:center">
<div class="grid" id="grid"></div>
</div>
<div style="text-align:center">
<div style="color:#aaa;font-size:13px;margin-top:8px">搜索单词:</div>
<div class="word-display" id="wordDisplay"></div>
</div>
<div class="path-info" id="pathInfo">路径: -</div>
<div class="dir-info" id="dirInfo"></div>
<div class="result-box" id="resultBox"></div>
</div>
<div class="panel">
<div class="panel-title">DFS 搜索过程</div>
<canvas id="recCanvas" width="520" height="420"></canvas>
</div>
</div>
<div class="info-box" id="infoBox"><span class="step-info">点击 ▶播放 开始动画演示</span></div>
<div class="controls">
<button id="btnPlay" onclick="play()">▶播放</button>
<button id="btnPause" onclick="pause()" disabled>⏸暂停</button>
<button id="btnReset" onclick="reset()">⏮重置</button>
<button id="btnPrev" onclick="prevStep()" disabled>◀步骤后退</button>
<button id="btnNext" onclick="nextStep()" disabled>步骤前进▶</button>
<span id="stepCounter" style="color:#aaa;font-size:14px;line-height:36px;margin-left:10px">步骤: 0/0</span>
</div>
<script>
const BOARD=[['A','B','C'],['S','F','C'],['A','D','E']];
const WORD="ABCCED";
const ROWS=3,COLS=3;
const DIRS=[[0,1,'右'],[1,0,'下'],[0,-1,'左'],[-1,0,'上']];
const canvas=document.getElementById('recCanvas');
const ctx=canvas.getContext('2d');
let steps=[];let currentStep=0;let playing=false;let timer=null;

function buildGrid(visited,path,curR,curC,backtrackCells){
  const grid=document.getElementById('grid');grid.innerHTML='';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const isVisited=visited&&visited.has(r+','+c);
      const isCurrent=curR===r&&curC===c;
      const isBack=backtrackCells&&backtrackCells.has(r+','+c);
      const isInPath=path&&path.some(([pr,pc])=>pr===r&&pc===c);
      let cls='empty';
      if(isCurrent)cls='current';
      else if(isBack)cls='backtrack';
      else if(isInPath)cls='visited';
      grid.innerHTML+=`<div class="cell ${cls}">${BOARD[r][c]}</div>`;
    }
  }
}

function buildWordDisplay(matchLen){
  const wd=document.getElementById('wordDisplay');wd.innerHTML='';
  WORD.split('').forEach((ch,i)=>{
    const cls=i<matchLen?'matched':i===matchLen?'current':'pending';
    wd.innerHTML+=`<div class="word-char ${cls}">${ch}</div>`;
  });
}

function generateSteps(){
  steps=[];
  const visited=new Set();
  function dfs(r,c,idx,path){
    const key=r+','+c;
    visited.add(key);
    path.push([r,c]);
    steps.push({type:'visit',r,c,idx,visited:new Set(visited),path:[...path],backtrack:new Set(),
      desc:`访问 [${r},${c}]='${BOARD[r][c]}'，匹配 word[${idx}]='${WORD[idx]}'`});
    if(idx===WORD.length-1){
      steps.push({type:'found',r,c,idx,visited:new Set(visited),path:[...path],backtrack:new Set(),
        desc:`找到完整路径！word="${WORD}" 匹配成功`});
      visited.delete(key);path.pop();
      return;
    }
    for(const [dr,dc,dirName] of DIRS){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!visited.has(nr+','+nc)&&BOARD[nr][nc]===WORD[idx+1]){
        steps.push({type:'explore',r:nr,c:nc,idx:idx+1,visited:new Set(visited),path:[...path],dir:dirName,backtrack:new Set(),
          desc:`向${dirName}探索 [${nr},${nc}]='${BOARD[nr][nc]}'`});
        dfs(nr,nc,idx+1,[...path]);
      }else{
        const reason=nr<0||nr>=ROWS||nc<0||nc>=COLS?'越界':visited.has(nr+','+nc)?'已访问':BOARD[nr][nc]!==WORD[idx+1]?'字母不匹配':'';
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
          steps.push({type:'skip',r:nr,c:nc,idx:idx+1,visited:new Set(visited),path:[...path],backtrack:new Set(),reason,
            desc:`跳过 [${nr},${nc}]：${reason}`});
        }
      }
    }
    const btSet=new Set();btSet.add(key);
    steps.push({type:'backtrack',r,c,idx,visited:new Set(visited),path:[...path].slice(0,-1),backtrack:btSet,
      desc:`回溯 [${r},${c}]，撤销访问`});
    visited.delete(key);path.pop();
  }
  steps.push({type:'start',r:-1,c:-1,idx:0,visited:new Set(),path:[],backtrack:new Set(),
    desc:`开始搜索 word="${WORD}"`});
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(BOARD[r][c]===WORD[0]){
        steps.push({type:'start_point',r,c,idx:0,visited:new Set(),path:[],backtrack:new Set(),
          desc:`起始点 [${r},${c}]='${BOARD[r][c]}' 匹配 word[0]`});
        dfs(r,c,0,[]);
      }
    }
  }
  steps.push({type:'done',r:-1,c:-1,idx:0,visited:new Set(),path:[],backtrack:new Set(),
    desc:`搜索完成，${steps.some(s=>s.type==='found')?'找到单词':'未找到单词'}`});
}

function drawRec(step){
  ctx.clearRect(0,0,520,420);
  if(!step){ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',200,200);return;}
  const x0=30,y0=25,lh=30;
  ctx.font='12px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  let y=y0;let cnt=0;
  for(let i=Math.max(0,currentStep-12);i<=currentStep&&i<steps.length;i++){
    const s=steps[i];const isCur=i===currentStep;
    const indent=Math.min(s.idx,6)*12;
    const icons={start:'▶',start_point:'●',visit:'→',explore:'↗',skip:'✗',backtrack:'↩',found:'★',done:'■'};
    const icon=icons[s.type]||'·';
    ctx.fillStyle=isCur?'#e94560':s.type==='found'?'#16c79a':s.type==='skip'?'#e9456088':s.type==='backtrack'?'#aaa':'#888';
    if(isCur){ctx.fillStyle='#1a1a2e';ctx.fillRect(20,y-12,490,24);ctx.fillStyle='#e94560';}
    ctx.fillText(' '.repeat(indent/4)+icon+' '+s.desc.slice(0,42),x0+indent,y);
    y+=lh;cnt++;if(y>400)break;
  }
}

function updateUI(step){
  if(!step)return;
  buildGrid(step.visited,step.path,step.r,step.c,step.backtrack);
  buildWordDisplay(step.type==='found'?WORD.length:step.idx);
  document.getElementById('pathInfo').textContent=`路径: ${step.path.map(([r,c])=>`[${r},${c}]=${BOARD[r][c]}`).join(' → ')||'-'}`;
  document.getElementById('dirInfo').textContent=step.dir?`方向: ${step.dir}`:'';
  const rb=document.getElementById('resultBox');
  if(step.type==='found'){rb.className='result-box found';rb.textContent=`找到单词 "${WORD}"！`;}
  else if(step.type==='done'&&!steps.some(s=>s.type==='found')){rb.className='result-box not-found';rb.textContent=`未找到单词 "${WORD}"`;}
  else{rb.className='result-box';rb.textContent='';}
  document.getElementById('infoBox').innerHTML=`<span class="step-info">${step.desc}</span>`;
  drawRec(step);
  document.getElementById('stepCounter').textContent=`步骤: ${currentStep+1}/${steps.length}`;
}

function play(){if(currentStep>=steps.length-1)reset();playing=true;
  document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  document.getElementById('btnNext').disabled=true;document.getElementById('btnPrev').disabled=true;
  timer=setInterval(()=>{if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}else pause();},600);}
function pause(){playing=false;clearInterval(timer);
  document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true;
  document.getElementById('btnNext').disabled=currentStep>=steps.length-1;document.getElementById('btnPrev').disabled=currentStep<=0;}
function reset(){pause();currentStep=0;
  buildGrid(new Set(),[],-1,-1,new Set());buildWordDisplay(0);
  document.getElementById('pathInfo').textContent='路径: -';
  document.getElementById('dirInfo').textContent='';
  document.getElementById('resultBox').className='result-box';
  document.getElementById('infoBox').innerHTML='<span class="step-info">点击 ▶播放 开始动画演示</span>';
  ctx.clearRect(0,0,520,420);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',200,200);
  document.getElementById('stepCounter').textContent='步骤: 0/0';
  document.getElementById('btnPrev').disabled=true;document.getElementById('btnNext').disabled=false;
  generateSteps();}
function nextStep(){if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
function prevStep(){if(currentStep>0){currentStep--;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
generateSteps();buildGrid(new Set(),[],-1,-1,new Set());buildWordDisplay(0);
ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',200,200);
</script>
</body>
</html>
