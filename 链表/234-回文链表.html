<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 234 - 回文链表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>234. 回文链表</h1>
<p class="subtitle">给你一个单链表的头节点 head，请你判断该链表是否为回文链表。步骤：快慢指针找中点，反转后半部分，比较前后两半。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表节点</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>慢指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>快指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>比较中</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="520"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=520;
const list=[1,2,2,1];
const NW=56,NH=38,NGAP=28;
const sx=60;
function buildSteps(){
  const steps=[],n=list.length,mid=Math.floor(n/2);
  steps.push({slow:0,fast:0,phase:'init',firstHalf:[...list],secondHalf:[],compareIdx:-1,desc:'初始链表：1→2→2→1，判断是否回文'});
  steps.push({slow:0,fast:0,phase:'find_mid_start',firstHalf:[...list],secondHalf:[],compareIdx:-1,desc:'步骤1：快慢指针找中点，slow走1步，fast走2步'});
  let s=0,f=0;
  while(f<n-1){
    s++;f+=2;
    steps.push({slow:s,fast:Math.min(f,n-1),phase:'find_mid',firstHalf:[...list],secondHalf:[],compareIdx:-1,desc:`slow→${list[s]}，fast→${list[Math.min(f,n-1)]}`});
  }
  steps.push({slow:s,fast:f,phase:'mid_found',firstHalf:[...list],secondHalf:[],compareIdx:-1,desc:`中点找到！slow在位置${s+1}（值=${list[s]}），即将反转后半部分`});
  const secondHalf=list.slice(mid).reverse();
  const firstHalf=list.slice(0,mid);
  steps.push({slow:s,fast:f,phase:'reverse',firstHalf,secondHalf,compareIdx:-1,desc:`反转后半部分：${list.slice(mid).join('→')} → ${secondHalf.join('→')}`});
  for(let i=0;i<mid;i++){
    const match=firstHalf[i]===secondHalf[i];
    steps.push({slow:s,fast:f,phase:'compare',firstHalf,secondHalf,compareIdx:i,desc:`比较：前半[${i}]=${firstHalf[i]} vs 后半(反)[${i}]=${secondHalf[i]} ${match?'相等 ✓':'不相等 ✗'}`});
  }
  steps.push({slow:s,fast:f,phase:'done',firstHalf,secondHalf,compareIdx:mid,desc:'所有比较均相等！该链表是回文链表 ✓'});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=7;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function drawList(arr,y,color,label,hlIdx,compareIdx){
  ctx.font='12px Microsoft YaHei';ctx.fillStyle=color;ctx.textAlign='start';ctx.fillText(label,sx,y-12);
  for(let i=0;i<arr.length;i++){
    const x=sx+i*(NW+NGAP);
    let c=color;
    if(i===compareIdx)c='#e94560';
    else if(i===hlIdx)c=color;
    const hl=i===compareIdx||i===hlIdx;
    ctx.fillStyle=hl?c:'#2a2a4a';ctx.strokeStyle=c;ctx.lineWidth=hl?2.5:1.5;
    roundRect(x,y,NW,NH,6,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(arr[i],x+NW/2,y+NH/2);
    if(i<arr.length-1)drawArrow(x+NW+2,y+NH/2,x+NW+NGAP-2,y+NH/2,hl?c:'#555');
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:steps[0];
  if(s.phase==='init'||s.phase==='find_mid_start'||s.phase==='find_mid'||s.phase==='mid_found'){
    const hlSlow=s.phase!=='init'?s.slow:-1;
    const hlFast=s.phase!=='init'?Math.min(s.fast,list.length-1):-1;
    for(let i=0;i<list.length;i++){
      const x=sx+i*(NW+NGAP);
      const isSlow=i===hlSlow,isFast=i===hlFast;
      let c='#4fc3f7';let hl=false;
      if(isSlow&&isFast){c='#16c79a';hl=true;}
      else if(isSlow){c='#16c79a';hl=true;}
      else if(isFast){c='#ffb74d';hl=true;}
      ctx.fillStyle=hl?c:'#2a2a4a';ctx.strokeStyle=c;ctx.lineWidth=hl?2.5:1.5;
      roundRect(x,200,NW,NH,6,true,true);
      ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(list[i],x+NW/2,200+NH/2);
      if(isSlow){ctx.font='bold 11px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.fillText('slow',x+NW/2,200-12);}
      if(isFast){ctx.font='bold 11px Microsoft YaHei';ctx.fillStyle='#ffb74d';ctx.fillText('fast',x+NW/2+20,200-12);}
      if(i<list.length-1)drawArrow(x+NW+2,200+NH/2,x+NW+NGAP-2,200+NH/2,'#666');
    }
  } else {
    drawList(s.firstHalf,160,'#4fc3f7','前半部分',-1,s.compareIdx);
    drawList(s.secondHalf,300,'#16c79a','后半部分(已反转)',-1,s.compareIdx);
    if(s.compareIdx>=0&&s.compareIdx<s.firstHalf.length){
      const x1=sx+s.compareIdx*(NW+NGAP)+NW/2;
      const y1=160+NH;const y2=300;
      ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(x1,y1+4);ctx.lineTo(x1,y2-4);ctx.stroke();ctx.setLineDash([]);
      ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.textAlign='center';
      const match=s.firstHalf[s.compareIdx]===s.secondHalf[s.compareIdx];
      ctx.fillText(match?'= 相等':'≠ 不等',x1,(y1+y2)/2+4);
    }
    if(s.phase==='done'){
      ctx.font='bold 16px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.textAlign='center';
      ctx.fillText('是回文链表!',W/2,440);
    }
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1400);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
