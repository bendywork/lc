<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 21 - 合并两个有序链表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>21. 合并两个有序链表</h1>
<p class="subtitle">将两个升序链表合并为一个新的升序链表并返回。新链表是通过拼接给定的两个链表的所有节点组成的。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表1 (l1)</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>链表2 (l2)</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>合并结果</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>当前比较</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="520"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=520;
const l1=[1,2,4],l2=[1,3,4];
const NW=56,NH=38,NGAP=32;
function buildSteps(){
  const steps=[];
  steps.push({i:0,j:0,result:[],phase:'init',desc:'初始：l1 = 1→2→4，l2 = 1→3→4，创建哑节点'});
  let i=0,j=0,result=[];
  while(i<l1.length&&j<l2.length){
    steps.push({i,j,result:[...result],phase:'compare',desc:`比较：l1[${i}]=${l1[i]} vs l2[${j}]=${l2[j]}`});
    if(l1[i]<=l2[j]){
      result.push(l1[i]);
      steps.push({i,j,result:[...result],phase:'pick_l1',desc:`${l1[i]} ≤ ${l2[j]}，选取l1的${l1[i]}，l1前进`});
      i++;
    }else{
      result.push(l2[j]);
      steps.push({i,j,result:[...result],phase:'pick_l2',desc:`${l1[i]} > ${l2[j]}，选取l2的${l2[j]}，l2前进`});
      j++;
    }
  }
  while(i<l1.length){result.push(l1[i]);steps.push({i:i+1,j,result:[...result],phase:'rest_l1',desc:`l2已空，剩余l1节点${l1[i]}直接接入`});i++;}
  while(j<l2.length){result.push(l2[j]);steps.push({i,j:j+1,result:[...result],phase:'rest_l2',desc:`l1已空，剩余l2节点${l2[j]}直接接入`});j++;}
  steps.push({i,j,result:[...result],phase:'done',desc:`合并完成！结果：${result.join('→')}`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=7;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function drawList(arr,y,sx,curIdx,color,label,strikeIdx){
  ctx.font='13px Microsoft YaHei';ctx.fillStyle=color;ctx.textAlign='start';ctx.fillText(label,sx,y-14);
  for(let i=0;i<arr.length;i++){
    const x=sx+i*(NW+NGAP);
    const hl=i===curIdx;
    ctx.fillStyle=hl?color:'#2a2a4a';ctx.strokeStyle=hl?color:'#555';ctx.lineWidth=hl?2.5:1.5;
    roundRect(x,y,NW,NH,6,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(arr[i],x+NW/2,y+NH/2);
    if(i<arr.length-1)drawArrow(x+NW+2,y+NH/2,x+NW+NGAP-2,y+NH/2,hl?color:'#555');
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:{i:0,j:0,result:[],phase:'init'};
  const sx=40;
  drawList(l1,80,sx,s.phase==='compare'||s.phase==='pick_l1'?s.i:-1,'#4fc3f7','l1');
  drawList(l2,180,sx,s.phase==='compare'||s.phase==='pick_l2'?s.j:-1,'#ffb74d','l2');
  if(s.phase==='compare'){
    const x1=sx+s.i*(NW+NGAP)+NW/2,x2=sx+s.j*(NW+NGAP)+NW/2;
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(x1,80+NH+4);ctx.lineTo(x1,140);
    ctx.moveTo(x2,180+NH+4);ctx.lineTo(x2,140);ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 14px monospace';ctx.fillStyle='#e94560';ctx.textAlign='center';
    ctx.fillText(`${l1[s.i]} vs ${l2[s.j]}`,(x1+x2)/2,142);
  }
  drawList(s.result,340,sx,s.result.length-1,'#16c79a','结果');
  if(s.phase==='pick_l1'&&s.i<l1.length){
    ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    const x1=sx+(s.i)*(NW+NGAP)+NW/2,y1=80+NH;
    const x2=sx+(s.result.length-1)*(NW+NGAP)+NW/2,y2=340;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(x1+50,(y1+y2)/2,x2,y2);ctx.stroke();ctx.setLineDash([]);
  }
  if(s.phase==='pick_l2'&&s.j<l2.length){
    ctx.strokeStyle='#ffb74d';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    const x1=sx+(s.j)*(NW+NGAP)+NW/2,y1=180+NH;
    const x2=sx+(s.result.length-1)*(NW+NGAP)+NW/2,y2=340;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(x1+50,(y1+y2)/2,x2,y2);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
