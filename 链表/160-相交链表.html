<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 160 - 相交链表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>160. 相交链表</h1>
<p class="subtitle">给你两个单链表的头节点 headA 和 headB，请你找出并返回两个单链表相交的起始节点。双指针法：pA走完A走B，pB走完B走A，必在交点相遇。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表A + pA路径</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>链表B + pB路径</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>相交点</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>共用尾部</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="500"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=500;
const listA=[4,1],listB=[5,6,1],common=[8,4,5];
const intersectIdx=2;
const NW=50,NH=34,NGAP=22;
function buildSteps(){
  const steps=[];
  const aPath=[...listA,...common];const bPath=[...listB,...common];
  const aLen=aPath.length,bLen=bPath.length;
  const commonLen=common.length;
  steps.push({pA:0,pB:0,phase:'init',desc:'初始：A=4→1→8→4→5，B=5→6→1→8→4→5，相交点为8'});
  let pA=0,pB=0;
  const pathA=[],pathB=[];
  for(let i=0;i<aLen;i++)pathA.push({list:'A',idx:i});
  for(let i=0;i<bLen;i++)pathA.push({list:'B',idx:i});
  for(let i=0;i<bLen;i++)pathB.push({list:'B',idx:i});
  for(let i=0;i<aLen;i++)pathB.push({list:'A',idx:i});
  const totalSteps=Math.max(aLen,bLen)+Math.min(aLen,bLen);
  let aInB=false,bInA=false;
  for(let step=0;step<=totalSteps+1;step++){
    const aVal=pA<aLen?aPath[pA]:bPath[pA-aLen];
    const bVal=pB<bLen?bPath[pB]:aPath[pB-bLen];
    const aList=pA<aLen?'A':'B';
    const bList=pB<bLen?'B':'A';
    if(pA===aLen&&!aInB){aInB=true;steps.push({pA,pB,phase:'switch',desc:`pA走完链表A，切换到链表B头部继续走`});}
    if(pB===bLen&&!bInA){bInA=true;steps.push({pA,pB,phase:'switch',desc:`pB走完链表B，切换到链表A头部继续走`});}
    if(aVal===bVal&&aList===bList&&pA>=aLen-commonLen&&pB>=bLen-commonLen){
      steps.push({pA,pB,phase:'meet',desc:`pA和pB在节点${aVal}相遇！这就是相交起始节点`});break;
    }
    steps.push({pA,pB,phase:'move',desc:`第${step+1}步：pA=${aVal}(链表${aList})，pB=${bVal}(链表${bList})`});
    if(pA<aLen+bLen)pA++;if(pB<bLen+aLen)pB++;
  }
  steps.push({pA,pB,phase:'done',desc:`原理：pA走 A+B=${aLen}+${bLen}=${aLen+bLen}步，pB走 B+A=${bLen}+${aLen}=${aLen+bLen}步，总路程相同，必在交点相遇`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
const aPath=[...listA,...common];const bPath=[...listB,...common];
function nodePosA(i){return{x:60+i*(NW+NGAP),y:100};}
function nodePosB(i){return{x:60+i*(NW+NGAP),y:240};}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=6;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function drawList(arr,y,positions,color,label,hlIdx){
  ctx.font='12px Microsoft YaHei';ctx.fillStyle=color;ctx.textAlign='start';ctx.fillText(label,20,y+4);
  for(let i=0;i<arr.length;i++){
    const p=positions(i);const hl=i===hlIdx;
    ctx.fillStyle=hl?color:'#2a2a4a';ctx.strokeStyle=color;ctx.lineWidth=hl?2.5:1.5;
    roundRect(p.x,y,NW,NH,5,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(arr[i],p.x+NW/2,y+NH/2);
    if(i<arr.length-1)drawArrow(p.x+NW+1,y+NH/2,positions(i+1).x-1,y+NH/2,hl?color:'#555');
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:steps[0];
  const pA=s.pA,pB=s.pB;
  const aHighlight=pA<aPath.length?pA:-1;
  const bHighlight=pB<bPath.length?pB:-1;
  drawList(aPath,100,nodePosA,'#4fc3f7','A',aHighlight);
  drawList(bPath,240,nodePosB,'#ffb74d','B',bHighlight);
  const commonStartA=listA.length,commonStartB=listB.length;
  const pACommon=nodePosA(commonStartA),pBCommon=nodePosB(commonStartB);
  ctx.strokeStyle='#16c79a';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(pACommon.x+NW/2,100+NH);ctx.lineTo(pBCommon.x+NW/2,240);
  ctx.stroke();ctx.setLineDash([]);
  if(s.phase==='meet'||s.phase==='done'){
    const meetP=nodePosA(commonStartA);
    ctx.fillStyle='#e94560';ctx.strokeStyle='#e94560';ctx.lineWidth=2.5;
    roundRect(meetP.x,100,NW,NH,5,true,true);
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(common[0],meetP.x+NW/2,100+NH/2);
    ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.fillText('相交!',meetP.x+NW/2,80);
  }
  if(s.phase==='switch'){
    ctx.font='bold 13px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.textAlign='center';
    ctx.fillText('切换链表!',W/2,370);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
