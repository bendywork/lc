<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 23 - 合并K个升序链表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:960px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>23. 合并K个升序链表</h1>
<p class="subtitle">给你一个链表数组，每个链表都已经按升序排列。请你将所有链表合并到一个升序链表中，返回合并后的链表。使用最小堆（优先队列）。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表1</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>链表2</div>
<div class="legend-item"><div class="legend-dot" style="background:#ab47bc"></div>链表3</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>结果</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>最小堆</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="960" height="620"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=960,H=620;
const lists=[[1,4,5],[1,3,4],[2,6]];
const colors=['#4fc3f7','#ffb74d','#ab47bc'];
const NW=48,NH=34,NGAP=24;
function buildSteps(){
  const steps=[];
  const ptrs=lists.map(()=>0);
  const heap=[];const result=[];
  steps.push({ptrs:[...ptrs],heap:[],result:[],phase:'init',desc:'初始状态：3个升序链表，最小堆为空'});
  for(let i=0;i<lists.length;i++){
    heap.push({listIdx:i,val:lists[i][0]});
    steps.push({ptrs:[...ptrs],heap:heap.map(h=>({...h})),result:[],phase:'push',desc:`将链表${i+1}的头节点${lists[i][0]}加入最小堆`});
  }
  while(heap.length>0){
    heap.sort((a,b)=>a.val-b.val);
    const min=heap.shift();
    result.push(min.val);
    ptrs[min.listIdx]++;
    steps.push({ptrs:[...ptrs],heap:heap.map(h=>({...h})),result:[...result],picked:min,phase:'pop',desc:`弹出堆顶最小值${min.val}（来自链表${min.listIdx+1}），加入结果`});
    if(ptrs[min.listIdx]<lists[min.listIdx].length){
      const nv=lists[min.listIdx][ptrs[min.listIdx]];
      heap.push({listIdx:min.listIdx,val:nv});
      steps.push({ptrs:[...ptrs],heap:heap.map(h=>({...h})),result:[...result],pushed:{listIdx:min.listIdx,val:nv},phase:'push',desc:`将链表${min.listIdx+1}的下一个节点${nv}加入最小堆`});
    }
  }
  steps.push({ptrs:[...ptrs],heap:[],result:[...result],phase:'done',desc:`合并完成！结果：${result.join('→')}`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=6;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function drawNode(val,x,y,color,hl){
  ctx.fillStyle=hl?color:'#2a2a4a';ctx.strokeStyle=color;ctx.lineWidth=hl?2.5:1.5;
  roundRect(x,y,NW,NH,5,true,true);
  ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(val,x+NW/2,y+NH/2);
}
function drawListRow(arr,y,sx,ptrIdx,color,label){
  ctx.font='12px Microsoft YaHei';ctx.fillStyle=color;ctx.textAlign='start';ctx.fillText(label,sx,y-10);
  for(let i=0;i<arr.length;i++){
    const x=sx+i*(NW+NGAP);
    drawNode(arr[i],x,y,color,i===ptrIdx);
    if(i<arr.length-1)drawArrow(x+NW+1,y+NH/2,x+NW+NGAP-1,y+NH/2,color);
  }
}
function drawHeap(heap,hx,hy){
  ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.textAlign='start';ctx.fillText('最小堆',hx,hy-10);
  if(heap.length===0){ctx.fillStyle='#555';ctx.font='13px Microsoft YaHei';ctx.fillText('(空)',hx,hy+20);return;}
  for(let i=0;i<heap.length;i++){
    const x=hx+i*(NW+8);
    ctx.fillStyle='#e94560';ctx.strokeStyle='#e94560';ctx.lineWidth=2;
    roundRect(x,hy,NW,NH,5,true,true);
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(heap[i].val,x+NW/2,hy+NH/2);
    ctx.font='10px Microsoft YaHei';ctx.fillStyle=colors[heap[i].listIdx];
    ctx.fillText('L'+(heap[i].listIdx+1),x+NW/2,hy+NH+12);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:{ptrs:lists.map(()=>0),heap:[],result:[],phase:'init'};
  const sx=30;
  for(let k=0;k<lists.length;k++){
    drawListRow(lists[k],60+k*80,sx,s.ptrs[k]<lists[k].length?s.ptrs[k]:-1,colors[k],`链表${k+1}`);
  }
  drawHeap(s.heap,30,320);
  ctx.font='12px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.textAlign='start';ctx.fillText('结果链表',30,420);
  for(let i=0;i<s.result.length;i++){
    const x=30+i*(NW+NGAP);
    drawNode(s.result[i],x,435,'#16c79a',i===s.result.length-1);
    if(i<s.result.length-1)drawArrow(x+NW+1,435+NH/2,x+NW+NGAP-1,435+NH/2,'#16c79a');
  }
  if(s.picked){
    ctx.font='13px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.textAlign='left';
    ctx.fillText(`← 弹出: ${s.picked.val} (链表${s.picked.listIdx+1})`,30+s.result.length*(NW+NGAP)+20,435+NH/2+4);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
