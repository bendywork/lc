<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 2 - 两数相加</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{position:relative;border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:900px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>2. 两数相加</h1>
<p class="subtitle">给你两个非空的链表，表示两个非负的整数。它们每位数字都是按照逆序的方式存储的，并且每个节点只能存储一位数字。请你将两个数相加，并以相同形式返回一个表示和的链表。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表1 (l1)</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>链表2 (l2)</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>结果链表</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>进位</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="520"></canvas></div>
<div class="controls">
<button class="btn" id="btnReset" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=520;
const l1=[2,4,3],l2=[5,6,4];
const NW=52,NH=36,NGAP=28;
function buildSteps(){
  const steps=[];
  let carry=0,i=0,j=0,result=[];
  steps.push({l1i:0,l2i:0,ri:0,carry:0,phase:'init',desc:'初始状态：l1 = 2→4→3 (代表342)，l2 = 5→6→4 (代表465)，carry = 0'});
  while(i<l1.length||j<l2.length||carry){
    const a=i<l1.length?l1[i]:0,b=j<l2.length?l2[j]:0;
    const sum=a+b+carry;
    const newCarry=Math.floor(sum/10);
    const digit=sum%10;
    steps.push({l1i:i,l2i:j,ri:result.length,carry,a,b,sum,digit,newCarry,phase:'add',desc:`相加：l1第${i+1}位=${a} + l2第${j+1}位=${b} + 进位${carry} = ${sum}，结果位=${digit}，新进位=${newCarry}`});
    result.push(digit);carry=newCarry;i++;j++;
  }
  steps.push({l1i:i,l2i:j,ri:result.length,carry:0,phase:'done',desc:`完成！结果链表：${result.join('→')}（代表${[...result].reverse().join('')}），即 342 + 465 = 807`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function drawList(arr,y,startX,highlightIdx,color,label){
  ctx.font='13px Microsoft YaHei';ctx.fillStyle=color;ctx.fillText(label,startX,y-12);
  for(let i=0;i<arr.length;i++){
    const x=startX+i*(NW+NGAP);
    ctx.fillStyle=i===highlightIdx?color:'#2a2a4a';
    ctx.strokeStyle=color;ctx.lineWidth=i===highlightIdx?2.5:1.5;
    roundRect(x,y,NW,NH,6,true,true);
    ctx.fillStyle=i===highlightIdx?'#fff':'#ccc';ctx.font='bold 16px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(arr[i],x+NW/2,y+NH/2);
    if(i<arr.length-1){drawArrow(x+NW+2,y+NH/2,x+NW+NGAP-2,y+NH/2,color);}
  }
}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=8;
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:{l1i:-1,l2i:-1,ri:-1,carry:0,phase:'init'};
  const sx=60;
  drawList(l1,80,sx,s.phase==='add'?s.l1i:-1,'#4fc3f7','l1');
  drawList(l2,170,sx,s.phase==='add'?s.l2i:-1,'#ffb74d','l2');
  const resLen=s.phase==='done'?steps[curStep-1]?buildResultUpTo(curStep-1).length:0:buildResultUpTo(curStep).length;
  const resArr=buildResultUpTo(curStep);
  if(resArr.length>0){
    drawList(resArr,300,sx,resArr.length-1,'#16c79a','结果');
  } else {
    ctx.font='13px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.fillText('结果',sx,288);
  }
  if(s.carry!==undefined&&s.carry>0){
    ctx.font='bold 20px monospace';ctx.fillStyle='#e94560';ctx.textAlign='left';
    ctx.fillText('carry = '+s.carry,sx+400,100);
  }
  if(s.phase==='add'){
    const a=s.a,b=s.b;
    const i1=s.l1i,i2=s.l2i;
    ctx.setLineDash([5,5]);ctx.strokeStyle='#e94560';ctx.lineWidth=1.5;
    ctx.beginPath();const x1=sx+i1*(NW+NGAP)+NW/2,y1=80+NH;
    ctx.moveTo(x1,y1);ctx.lineTo(x1,y1+30);ctx.stroke();
    const x2=sx+i2*(NW+NGAP)+NW/2,y2=170+NH;
    ctx.moveTo(x2,y2);ctx.lineTo(x2,y2+10);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function buildResultUpTo(step){
  const r=[];
  for(let i=0;i<=step&&i<steps.length;i++){
    if(steps[i].phase==='add')r.push(steps[i].digit);
  }
  return r;
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){
  if(curStep<steps.length-1){curStep++;draw();updateUI();}
  else{stopPlay();}
}
function stepPrev(){
  if(curStep>0){curStep--;draw();updateUI();}
}
function togglePlay(){
  if(playing)stopPlay();else startPlay();
}
function startPlay(){
  playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';
  timer=setInterval(()=>{if(curStep<steps.length-1)stepNext();else stopPlay();},1200);
}
function stopPlay(){
  playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);
}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
