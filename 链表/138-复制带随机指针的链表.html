<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 138 - 复制带随机指针的链表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:960px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>138. 复制带随机指针的链表</h1>
<p class="subtitle">给你一个长度为 n 的链表，每个节点包含一个额外增加的随机指针 random，指向链表中的任意节点或 null。请构造它的深拷贝。三步法：1.交错复制 2.设置random 3.分离链表</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>原始节点</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>复制节点</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>next指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>random指针</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="960" height="600"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=960,H=600;
const vals=[7,13,11,10,1];
const randoms=[null,0,4,2,0];
const NW=54,NH=36,NGAP=26;
const sx=40;
function nodePos(i){return{x:sx+i*(NW*2+NGAP*2),y:220};}
function copyPos(i){return{x:sx+NW+NGAP+i*(NW*2+NGAP*2),y:220};}
function buildSteps(){
  const steps=[];
  const p = v => v + "’";
  steps.push({phase:'init',curIdx:-1,desc:'原始链表：7→13→11→10→1，各节点有random指针（虚线）'});
  for(let i=0;i<vals.length;i++){
    steps.push({phase:'interleave',curIdx:i,desc:"第1步-交错复制：在"+vals[i]+"后插入复制节点"+p(vals[i])+"，原next指向复制，复制指向原next"});
  }
  steps.push({phase:'interleave_done',curIdx:-1,desc:"交错复制完成：7→"+p("7")+"→13→"+p("13")+"→11→"+p("11")+"→10→"+p("10")+"→1→"+p("1")});
  for(let i=0;i<vals.length;i++){
    const rt=randoms[i]===null?"null":""+p(vals[randoms[i]]);
    steps.push({phase:'set_random',curIdx:i,desc:"第2步-设置random："+p(vals[i])+"的random = "+vals[i]+".random?.next = "+rt});
  }
  steps.push({phase:'random_done',curIdx:-1,desc:'所有random指针设置完成'});
  for(let i=0;i<vals.length;i++){
    steps.push({phase:'split',curIdx:i,desc:"第3步-分离：将"+vals[i]+"和"+p(vals[i])+"分开，恢复原链next和复制链next"});
  }
  steps.push({phase:'done',curIdx:-1,desc:"完成！原始链表："+vals.join("→")+"，复制链表："+vals.map(v=>p(v)).join("→")+"，深拷贝成功！"});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color,dashed){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=1.5;if(dashed)ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dashed)ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1),sz=5;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function drawCurvedArrow(x1,y1,x2,y2,color,down){
  ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,down?y1+60:y1-60,x2,y2);ctx.stroke();ctx.setLineDash([]);
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:steps[0];
  const showCopy=s.phase!=='init';
  const showSplit=s.phase==='split'||s.phase==='done';
  for(let i=0;i<vals.length;i++){
    const p=nodePos(i);
    const hl=i===s.curIdx&&(s.phase==='interleave'||s.phase==='set_random'||s.phase==='split');
    ctx.fillStyle=hl?'#4fc3f7':'#2a2a4a';ctx.strokeStyle='#4fc3f7';ctx.lineWidth=hl?2.5:1.5;
    roundRect(p.x,p.y,NW,NH,5,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(vals[i],p.x+NW/2,p.y+NH/2);
    if(showCopy){
      const cp=copyPos(i);
      const chl=i===s.curIdx;
      ctx.fillStyle=chl?'#16c79a':'#1a3a2e';ctx.strokeStyle='#16c79a';ctx.lineWidth=chl?2.5:1.5;
      roundRect(cp.x,cp.y,NW,NH,5,true,true);
      ctx.fillStyle=chl?'#fff':'#8f8';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(vals[i]+"’",cp.x+NW/2,cp.y+NH/2);
      if(!showSplit||s.phase==='split'&&i<s.curIdx){
      }else if(!showSplit){
        drawArrow(p.x+NW+1,p.y+NH/2,cp.x-1,cp.y+NH/2,'#ffb74d');
        if(i<vals.length-1)drawArrow(cp.x+NW+1,cp.y+NH/2,nodePos(i+1).x-1,p.y+NH/2,'#ffb74d');
      }
      if(s.phase==='set_random'&&i===s.curIdx&&randoms[i]!==null){
        const rTarget=copyPos(randoms[i]);
        drawCurvedArrow(cp.x+NW/2,cp.y,rTarget.x+NW/2,rTarget.y,'#e94560',true);
      }
    }
    if(randoms[i]!==null&&s.phase!=='split'&&s.phase!=='done'){
      const rp=nodePos(randoms[i]);
      drawCurvedArrow(p.x+NW/2,p.y,rp.x+NW/2,rp.y,'#e94560',true);
    }
  }
  if(showSplit){
    for(let i=0;i<vals.length;i++){
      const p=nodePos(i),cp=copyPos(i);
      if(i<vals.length-1){
        const np=nodePos(i+1),ncp=copyPos(i+1);
        const done=s.phase==='done'||i<s.curIdx;
        if(done){
          drawArrow(p.x+NW+1,p.y+NH/2,np.x-1,p.y+NH/2,'#4fc3f7');
          drawArrow(cp.x+NW+1,cp.y+NH/2,ncp.x-1,cp.y+NH/2,'#16c79a');
        }
      }
    }
  }
  ctx.font='bold 13px Microsoft YaHei';ctx.textAlign='left';
  if(s.phase==='interleave'||s.phase==='interleave_done'){ctx.fillStyle='#16c79a';ctx.fillText('阶段1：交错复制',40,40);}
  if(s.phase==='set_random'||s.phase==='random_done'){ctx.fillStyle='#e94560';ctx.fillText('阶段2：设置random指针',40,40);}
  if(s.phase==='split'){ctx.fillStyle='#4fc3f7';ctx.fillText('阶段3：分离链表',40,40);}
  if(s.phase==='done'){ctx.fillStyle='#16c79a';ctx.fillText('完成！深拷贝链表已构建',40,40);}
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
