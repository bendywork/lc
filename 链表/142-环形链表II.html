<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 142 - 环形链表II</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>142. 环形链表II</h1>
<p class="subtitle">给定一个链表，返回链表开始入环的第一个节点。Floyd算法：第一阶段找相遇点，第二阶段从头和相遇点同时走，再次相遇即为入环点。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>慢指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>快指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>查找指针</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>入环点</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="560"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=560;
const vals=[3,2,0,-4],cycleEntry=1;
const NW=56,NH=38;
function nodePos(i){
  return{x:100+i*130,y:180};
}
function buildSteps(){
  const steps=[],n=vals.length;
  steps.push({slow:0,fast:0,find:null,phase:'init',desc:'初始：链表3→2→0→-4→(回到2)，环从节点2开始'});
  steps.push({slow:0,fast:0,find:null,phase:'phase1_start',desc:'第一阶段：快慢指针从头部出发，slow每次1步，fast每次2步'});
  let s=0,f=0;
  do{
    s=(s+1)%n;f=(f+2)%n;
    const meet=s===f;
    steps.push({slow:s,fast:f,find:null,phase:meet?'phase1_done':'phase1',desc:meet?`在节点${vals[s]}相遇！第一阶段完成`:`slow→${vals[s]}，fast→${vals[f]}`});
  }while(s!==f);
  steps.push({slow:s,fast:f,find:0,phase:'phase2_start',desc:`第二阶段：ptr从头部出发，slow从相遇点出发，两者每次都走1步`});
  let ptr=0,slow2=s;
  while(ptr!==slow2){
    ptr=(ptr+1)%n;slow2=(slow2+1)%n;
    const found=ptr===slow2;
    steps.push({slow:slow2,fast:f,find:ptr,phase:found?'phase2_done':'phase2',desc:found?`在节点${vals[ptr]}再次相遇！这就是入环点`:`ptr→${vals[ptr]}，slow→${vals[slow2]}`});
  }
  steps.push({slow:slow2,fast:f,find:ptr,phase:'explain',desc:`数学证明：a=头到入环距离，b=入环到相遇距离，c=相遇到入环距离。slow走a+b，fast走a+b+c+b=2(a+b)，所以a=c，即从头部和相遇点同速前进必在入环点相遇`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=7;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:steps[0];
  const n=vals.length;
  for(let i=0;i<n;i++){
    const p=nodePos(i);
    let fillColor='#2a2a4a',strokeColor='#555';
    const isSlow=i===s.slow,isFast=i===s.fast,isFind=s.find!==null&&i===s.find;
    const isEntry=i===cycleEntry&&(s.phase==='phase2_done'||s.phase==='explain');
    if(isEntry){fillColor='#e94560';strokeColor='#e94560';}
    else if(isSlow&&isFast){fillColor='#e94560';strokeColor='#e94560';}
    else if(isFind){fillColor='#4fc3f7';strokeColor='#4fc3f7';}
    else if(isSlow){fillColor='#16c79a';strokeColor='#16c79a';}
    else if(isFast){fillColor='#ffb74d';strokeColor='#ffb74d';}
    const hl=fillColor!=='#2a2a4a';
    ctx.fillStyle=fillColor;ctx.strokeStyle=strokeColor;ctx.lineWidth=hl?2.5:1.5;
    roundRect(p.x,p.y,NW,NH,6,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(vals[i],p.x+NW/2,p.y+NH/2);
    const labels=[];
    if(isSlow)labels.push({t:'slow',c:'#16c79a'});
    if(isFast&&!isSlow)labels.push({t:'fast',c:'#ffb74d'});
    if(isFind)labels.push({t:'ptr',c:'#4fc3f7'});
    if(labels.length>0){
      ctx.font='bold 11px Microsoft YaHei';
      for(let li=0;li<labels.length;li++){
        ctx.fillStyle=labels[li].c;ctx.fillText(labels[li].t,p.x+NW/2+(li-labels.length/2+0.5)*30,p.y-12);
      }
    }
    if(i<n-1)drawArrow(p.x+NW+2,p.y+NH/2,nodePos(i+1).x-2,p.y+NH/2,'#666');
  }
  const lastP=nodePos(n-1),entryP=nodePos(cycleEntry);
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();
  ctx.moveTo(lastP.x+NW/2,lastP.y+NH);ctx.quadraticCurveTo(lastP.x+NW/2+40,lastP.y+NH+60,entryP.x+NW/2,entryP.y+NH);
  ctx.stroke();ctx.setLineDash([]);
  const a2=Math.atan2(entryP.y+NH-(lastP.y+NH+60),entryP.x+NW/2-(lastP.x+NW/2+40)),sz=7;
  ctx.fillStyle='#e94560';ctx.beginPath();ctx.moveTo(entryP.x+NW/2,entryP.y+NH);
  ctx.lineTo(entryP.x+NW/2-sz*Math.cos(a2-Math.PI/6),entryP.y+NH-sz*Math.sin(a2-Math.PI/6));
  ctx.lineTo(entryP.x+NW/2-sz*Math.cos(a2+Math.PI/6),entryP.y+NH-sz*Math.sin(a2+Math.PI/6));ctx.closePath();ctx.fill();
  if(s.phase==='phase1_done'||s.phase==='phase2_start'||s.phase==='phase2'||s.phase==='phase2_done'){
    ctx.font='13px Microsoft YaHei';ctx.fillStyle='#888';ctx.textAlign='left';
    ctx.fillText(`相遇点: 节点${vals[s.fast]}`,600,380);
  }
  if(s.phase==='explain'||s.phase==='phase2_done'){
    ctx.font='13px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.textAlign='left';
    ctx.fillText(`入环点: 节点${vals[cycleEntry]}`,600,400);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
