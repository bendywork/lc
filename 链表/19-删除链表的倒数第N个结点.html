<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 19 - 删除链表的倒数第N个结点</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>19. 删除链表的倒数第N个结点</h1>
<p class="subtitle">给你一个链表，删除链表的倒数第 n 个结点，并且返回链表的头结点。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>链表节点</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>快指针 (fast)</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>慢指针 (slow)</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>待删除节点</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="480"></canvas></div>
<div class="controls">
<button class="btn" id="btnReset" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=480;
const list=[1,2,3,4,5],n=2;
const NW=56,NH=38,NGAP=32;
const sx=50,ly=200;
function buildSteps(){
  const steps=[];
  steps.push({fast:-1,slow:-1,deleted:-1,phase:'init',desc:`初始链表：1→2→3→4→5，需要删除倒数第${n}个节点（值为${list[list.length-n]}）`});
  steps.push({fast:0,slow:0,deleted:-1,phase:'dummy',desc:'创建哑节点(dummy)，fast和slow都指向dummy节点'});
  for(let i=0;i<n;i++){
    steps.push({fast:i,slow:0,deleted:-1,phase:'fast_move',desc:`快指针前进：第${i+1}步，fast移动到节点${list[i]}`});
  }
  let f=n,s=0;
  while(f<list.length){
    steps.push({fast:f,slow:s,deleted:-1,phase:'both_move',desc:`快慢指针同时前进：fast→${list[f]}，slow→${list[s]}`});
    f++;s++;
  }
  steps.push({fast:f,slow:s,deleted:s+1,phase:'found',desc:`fast到达末尾！slow的下一个节点${list[s+1]}就是倒数第${n}个，标记为待删除`});
  steps.push({fast:f,slow:s,deleted:s+1,phase:'delete',desc:`删除节点：将slow.next指向slow.next.next，跳过节点${list[s+1]}`});
  const res=list.filter((_,i)=>i!==s+1);
  steps.push({fast:-1,slow:-1,deleted:-1,phase:'done',desc:`删除完成！结果链表：${res.join('→')}`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function drawNode(val,x,y,highlight,ptrLabel,ptrColor){
  ctx.fillStyle=highlight==='#e94560'?'#e94560':highlight==='#16c79a'?'#16c79a':highlight==='#ffb74d'?'#ffb74d':'#2a2a4a';
  ctx.strokeStyle=highlight||'#555';ctx.lineWidth=highlight?2.5:1.5;
  roundRect(x,y,NW,NH,6,true,true);
  ctx.fillStyle=highlight?'#fff':'#ccc';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(val,x+NW/2,y+NH/2);
  if(ptrLabel){
    ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle=ptrColor;
    ctx.fillText(ptrLabel,x+NW/2,y-8);
    ctx.strokeStyle=ptrColor;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x+NW/2,y-2);ctx.lineTo(x+NW/2,y);ctx.stroke();
  }
}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=7;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:{fast:-1,slow:-1,deleted:-1,phase:'init'};
  const deletedIdx=s.deleted;
  const showDummy=s.phase!=='init'&&s.phase!=='done';
  const dx=showDummy?sx+NW+NGAP:sx;
  for(let i=0;i<list.length;i++){
    const x=dx+i*(NW+NGAP);
    let hl=null;
    if(i===deletedIdx)hl='#e94560';
    const isFast=i===s.fast, isSlow=i===s.fast===s.slow&&i===s.slow;
    let fLabel=null,sLabel=null,fColor='#ffb74d',sColor2='#16c79a';
    if(isFast&&isSlow){fLabel='fast/slow';fColor='#16c79a';}
    else{if(isFast)fLabel='fast';if(i===s.slow)sLabel='slow';}
    drawNode(list[i],x,ly,hl,fLabel||sLabel,fLabel?fColor:sColor2);
    if(i===s.slow&&!isFast&&s.slow>=0){
      ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle='#16c79a';
      ctx.fillText('slow',x+NW/2,ly-8);
    }
    if(i<list.length-1){
      if(i===deletedIdx&&s.phase==='delete'){
        drawArrow(x+NW+2,ly+NH/2,x+NW+NGAP-2,ly+NH/2,'#555');
      } else if(i===s.slow&&s.phase==='delete'&&i+2===deletedIdx+1){
        ctx.setLineDash([4,4]);drawArrow(x+NW+2,ly+NH/2,x+NW+NGAP*2+NW-2,ly+NH/2,'#16c79a');ctx.setLineDash([]);
        drawArrow(x+NW+2,ly+NH/2,x+NW+NGAP-2,ly+NH/2,'#555');
      } else {
        drawArrow(x+NW+2,ly+NH/2,x+NW+NGAP-2,ly+NH/2,'#666');
      }
    }
  }
  if(showDummy){
    ctx.fillStyle='#16213e';ctx.strokeStyle='#888';ctx.lineWidth=1.5;
    roundRect(sx,ly,NW,NH,6,true,true);
    ctx.fillStyle='#999';ctx.font='12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('dummy',sx+NW/2,ly+NH/2);
    if(s.slow===0&&s.fast===0){
      ctx.font='bold 12px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.fillText('slow',sx+NW/2,ly-8);
      ctx.fillStyle='#ffb74d';ctx.fillText('fast',sx+NW/2+20,ly+NH+14);
    }
    drawArrow(sx+NW+2,ly+NH/2,dx-2,ly+NH/2,'#888');
  }
  if(s.phase==='delete'){
    const skipFrom=s.slow,skipTo=deletedIdx+1;
    if(skipTo<list.length){
      const x1=dx+skipFrom*(NW+NGAP)+NW+2,x2=dx+skipTo*(NW+NGAP)-2;
      ctx.strokeStyle='#16c79a';ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(x1,ly+NH/2+8);
      ctx.quadraticCurveTo((x1+x2)/2,ly+NH/2+40,x2,ly+NH/2+8);ctx.stroke();ctx.setLineDash([]);
    }
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1200);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
