<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode 92 - 反转链表II</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 10px;font-size:24px;color:#e94560}
.subtitle{color:#888;font-size:14px;margin-bottom:15px}
.canvas-wrap{border:1px solid #333;border-radius:8px;overflow:hidden}
canvas{display:block}
.controls{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.btn{background:#16213e;border:1px solid #e94560;color:#e94560;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{background:#e94560;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step-info{background:#16213e;border:1px solid #333;border-radius:8px;padding:15px 20px;max-width:920px;width:90%;margin-bottom:20px}
.step-counter{color:#16c79a;font-size:14px;margin-bottom:8px}
.step-desc{color:#ddd;font-size:15px;line-height:1.6}
.legend{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa}
.legend-dot{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>92. 反转链表II</h1>
<p class="subtitle">给你单链表的头指针 head 和两个整数 left 和 right，其中 left ≤ right。请你反转从位置 left 到位置 right 的链表节点，返回反转后的链表。</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>前段（不反转）</div>
<div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>反转区间</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>后段（不反转）</div>
<div class="legend-item"><div class="legend-dot" style="background:#16c79a"></div>指针</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="920" height="500"></canvas></div>
<div class="controls">
<button class="btn" onclick="resetAnim()">⏮ 重置</button>
<button class="btn" id="btnPrev" onclick="stepPrev()">◀ 步骤后退</button>
<button class="btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button class="btn" id="btnNext" onclick="stepNext()">步骤前进 ▶</button>
</div>
<div class="step-info">
<div class="step-counter" id="stepCounter">步骤 0 / 0</div>
<div class="step-desc" id="stepDesc">点击"播放"或"步骤前进"开始动画</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=920,H=500;
const list=[1,2,3,4,5],left=2,right=4;
const NW=60,NH=40,NGAP=32;
const sx=50,ly=260;
function buildSteps(){
  const steps=[];
  steps.push({arr:[...list],phase:'init',ptrs:{},desc:`初始链表：1→2→3→4→5，反转位置 left=${left} 到 right=${right}`});
  steps.push({arr:[...list],phase:'find',ptrs:{prev:0,curr:1},desc:`找到位置left前的节点prev=${list[0]}，curr=${list[1]}`});
  const subLen=right-left+1;
  for(let i=0;i<subLen;i++){
    const ci=left-1+i;
    steps.push({arr:[...list],phase:'reverse',ptrs:{prev:ci-1>=left-1?ci-1:left-2,curr:ci,next:ci+1<=right-1?ci+1:null},desc:`翻转第${i+1}步：curr=${list[ci]}，将curr.next指向prev`});
  }
  const sub=list.slice(left-1,right);
  const rev=[...sub].reverse();
  const newArr=[...list.slice(0,left-1),...rev,...list.slice(right)];
  steps.push({arr:newArr,phase:'reconnect',ptrs:{},desc:`翻转子链表完成，重新连接：前段→翻转段→后段`});
  steps.push({arr:newArr,phase:'done',ptrs:{},desc:`完成！结果：${newArr.join('→')}（位置${left}到${right}已反转）`});
  return steps;
}
const steps=buildSteps();
let curStep=-1,playing=false,timer=null;
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function drawArrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color||'#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),sz=7;ctx.fillStyle=color||'#666';ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-sz*Math.cos(a-Math.PI/6),y2-sz*Math.sin(a-Math.PI/6));
  ctx.lineTo(x2-sz*Math.cos(a+Math.PI/6),y2-sz*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:steps[0];
  const arr=s.arr;
  for(let i=0;i<arr.length;i++){
    const x=sx+i*(NW+NGAP);
    let color='#4fc3f7';
    if(i>=left-1&&i<right&&s.phase!=='done'&&s.phase!=='reconnect')color='#e94560';
    else if(i>=right)color='#ffb74d';
    if(s.phase==='done'||s.phase==='reconnect'){
      if(i>=left-1&&i<right)color='#16c79a';
    }
    const hl=color==='#e94560'||color==='#16c79a';
    ctx.fillStyle=hl?color:'#2a2a4a';ctx.strokeStyle=color;ctx.lineWidth=hl?2.5:1.5;
    roundRect(x,ly,NW,NH,6,true,true);
    ctx.fillStyle=hl?'#fff':'#ccc';ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(arr[i],x+NW/2,ly+NH/2);
    if(s.ptrs&&i===s.ptrs.curr){ctx.font='bold 11px Microsoft YaHei';ctx.fillStyle='#16c79a';ctx.fillText('curr',x+NW/2,ly-14);}
    if(s.ptrs&&s.ptrs.prev!==null&&s.ptrs.prev>=0&&i===s.ptrs.prev){ctx.font='bold 11px Microsoft YaHei';ctx.fillStyle='#4fc3f7';ctx.fillText('prev',x+NW/2-18,ly-14);}
    if(s.ptrs&&s.ptrs.next!==null&&i===s.ptrs.next){ctx.font='bold 11px Microsoft YaHei';ctx.fillStyle='#ffb74d';ctx.fillText('next',x+NW/2+18,ly-14);}
    if(i<arr.length-1)drawArrow(x+NW+2,ly+NH/2,x+NW+NGAP-2,ly+NH/2,'#666');
  }
  if(s.phase!=='done'&&s.phase!=='reconnect'){
    const gx1=sx+(left-1)*(NW+NGAP)-6,gx2=sx+(right-1)*(NW+NGAP)+NW+6;
    ctx.strokeStyle='#e94560';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.strokeRect(gx1,ly-24,gx2-gx1,NH+34);ctx.setLineDash([]);
    ctx.font='12px Microsoft YaHei';ctx.fillStyle='#e94560';ctx.textAlign='center';
    ctx.fillText(`反转区间 [${left},${right}]`,(gx1+gx2)/2,ly-30);
  }
  if(s.phase==='done'||s.phase==='reconnect'){
    ctx.font='13px Microsoft YaHei';ctx.fillStyle='#4fc3f7';ctx.textAlign='left';ctx.fillText('前段',sx,ly+NH+20);
    ctx.fillStyle='#16c79a';ctx.fillText('翻转段',sx+(left-1)*(NW+NGAP),ly+NH+20);
    ctx.fillStyle='#ffb74d';ctx.fillText('后段',sx+right*(NW+NGAP),ly+NH+20);
  }
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function updateUI(){
  document.getElementById('stepCounter').textContent=`步骤 ${curStep+1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent=curStep>=0?steps[curStep].desc:'点击"播放"或"步骤前进"开始动画';
  document.getElementById('btnPrev').disabled=curStep<=0;
  document.getElementById('btnNext').disabled=curStep>=steps.length-1;
}
function stepNext(){if(curStep<steps.length-1){curStep++;draw();updateUI();}else stopPlay();}
function stepPrev(){if(curStep>0){curStep--;draw();updateUI();}}
function togglePlay(){playing?stopPlay():startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{curStep<steps.length-1?stepNext():stopPlay()},1400);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);}
function resetAnim(){stopPlay();curStep=-1;draw();updateUI();}
draw();updateUI();
</script>
</body>
</html>
