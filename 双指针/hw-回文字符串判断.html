<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>回文字符串判断</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5em;margin-bottom:10px;color:#e94560}
#desc{font-size:.9em;color:#aaa;margin-bottom:15px;text-align:center;max-width:900px}
canvas{background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-bottom:10px}
#stepInfo{background:#16213e;border-radius:8px;padding:12px 20px;margin-bottom:10px;min-width:600px;border:1px solid #0f3460}
#stepInfo .stepNum{color:#16c79a;font-weight:bold}
#stepInfo .stepDesc{color:#ddd;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls button{background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:.95em;transition:all .2s}
.controls button:hover{background:#e94560;color:#fff}
#speed{width:60px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;padding:4px 6px}
.legend{display:flex;gap:18px;margin-top:8px;font-size:.85em;color:#aaa;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>回文字符串判断</h1>
<p id="desc">判断字符串是否为回文串。双指针法：左指针从开头右移，右指针从末尾左移，每次比较两个字符是否相同，不同则不是回文。</p>
<canvas id="cv" width="900" height="420"></canvas>
<div id="stepInfo"><span class="stepNum">步骤 0/0</span><div class="stepDesc">点击「播放」或「步骤前进」开始演示</div></div>
<div class="controls">
<button onclick="reset()">⏮ 重置</button>
<button onclick="prevStep()">◀ 步骤后退</button>
<button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button onclick="nextStep()">步骤前进 ▶</button>
<label style="color:#aaa">速度:<input id="speed" type="number" value="1000" min="100" max="3000" step="100">ms</label>
</div>
<div class="legend">
<span><span class="dot" style="background:#e94560"></span>左指针</span>
<span><span class="dot" style="background:#16c79a"></span>右指针</span>
<span><span class="dot" style="background:#ffd700"></span>匹配✓</span>
<span><span class="dot" style="background:#e94560"></span>不匹配✗</span>
</div>
<script>
const testStr="racecar";
const steps=[];
function buildSteps(){
  steps.length=0;
  const s=testStr;
  let l=0,r=s.length-1;
  const matched=new Set();
  steps.push({l,r,matched:new Set(),result:null,desc:`初始化：左指针 L=0，右指针 R=${r}`});
  while(l<r){
    const equal=s[l]===s[r];
    if(equal){
      matched.add(l);matched.add(r);
      steps.push({l,r,matched:new Set(matched),result:null,desc:`比较 s[${l}]="${s[l]}" == s[${r}]="${s[r]}" ✓ 匹配！L→${l+1}，R→${r-1}`});
    }else{
      steps.push({l,r,matched:new Set(matched),result:false,desc:`比较 s[${l}]="${s[l]}" != s[${r}]="${s[r]}" ✗ 不匹配！不是回文串`});
      return;
    }
    l++;r--;
  }
  steps.push({l,r,matched:new Set(matched),result:true,desc:`所有字符对都匹配！"${s}" 是回文串`,final:true});
}
buildSteps();

let cur=-1,timer=null,playing=false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const s=testStr;
const cellW=70,gap=10;
const totalW=s.length*(cellW+gap)-gap;
const offsetX=(W-totalW)/2;
const baseY=180;

function draw(){
  ctx.clearRect(0,0,W,H);
  const st=cur<0?{l:0,r:s.length-1,matched:new Set(),result:null}:steps[cur];
  // draw characters
  for(let i=0;i<s.length;i++){
    const x=offsetX+i*(cellW+gap);
    let bg='#2a2a4a';
    if(st.matched.has(i))bg='#4a4a1a';
    if(i===st.l)bg='#e94560';
    if(i===st.r)bg='#16c79a';
    if(st.result===false&&(i===st.l||i===st.r))bg='#e94560';
    if(st.final)bg='#4a4a2a';
    ctx.fillStyle=bg;
    ctx.fillRect(x,baseY,cellW,60);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,baseY,cellW,60);
    ctx.fillStyle='#eee';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText(s[i],x+cellW/2,baseY+40);
    // index
    ctx.fillStyle='#888';ctx.font='11px sans-serif';
    ctx.fillText('['+i+']',x+cellW/2,baseY+78);
  }
  // pointer arrows
  // left pointer
  const lx=offsetX+st.l*(cellW+gap)+cellW/2;
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.moveTo(lx,baseY-15);ctx.lineTo(lx-8,baseY-28);ctx.lineTo(lx+8,baseY-28);ctx.closePath();ctx.fill();
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('L',lx,baseY-34);
  // right pointer
  const rx=offsetX+st.r*(cellW+gap)+cellW/2;
  ctx.fillStyle='#16c79a';
  ctx.beginPath();ctx.moveTo(rx,baseY-15);ctx.lineTo(rx-8,baseY-28);ctx.lineTo(rx+8,baseY-28);ctx.closePath();ctx.fill();
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('R',rx,baseY-34);
  // comparison line
  if(!st.final&&st.result!==false){
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([6,3]);
    ctx.beginPath();ctx.moveTo(lx,baseY-40);ctx.lineTo(rx,baseY-40);ctx.stroke();
    ctx.setLineDash([]);
  }
  // match/mismatch indicator
  if(st.result===false){
    ctx.strokeStyle='#e94560';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(lx+10,baseY+75);ctx.lineTo(rx-10,baseY+75);ctx.stroke();
    // X mark
    const mx=(lx+rx)/2;
    ctx.fillStyle='#e94560';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('✗ 不匹配!',mx,baseY+110);
  }
  // match indicator
  if(st.matched.size>0&&st.result!==false){
    const midX=(lx+rx)/2;
    if(st.l!==st.r&&st.matched.has(st.l)){
      ctx.fillStyle='#ffd700';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
      ctx.fillText('✓',midX,baseY-50);
    }
  }
  // result
  if(st.final){
    ctx.fillStyle='#ffd700';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText(`"${s}" 是回文串!`,W/2,H-50);
  }else if(st.result===false){
    ctx.fillStyle='#e94560';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText(`"${s}" 不是回文串!`,W/2,H-50);
  }
  // pointer positions info
  ctx.fillStyle='#aaa';ctx.font='14px sans-serif';ctx.textAlign='left';
  ctx.fillText(`L = ${st.l}，R = ${st.r}`,40,H-15);
}

function updateInfo(){
  const st=cur<0?null:steps[cur];
  document.querySelector('#stepInfo .stepNum').textContent=`步骤 ${cur+1}/${steps.length}`;
  document.querySelector('#stepInfo .stepDesc').textContent=st?st.desc:'点击「播放」或「步骤前进」开始演示';
}
function nextStep(){if(cur<steps.length-1){cur++;draw();updateInfo();}else stopPlay();}
function prevStep(){if(cur>=0){cur--;draw();updateInfo();}}
function reset(){stopPlay();cur=-1;draw();updateInfo();}
function togglePlay(){if(playing)stopPlay();else startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return;}nextStep();},+document.getElementById('speed').value);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}

draw();updateInfo();
</script>
</body>
</html>
