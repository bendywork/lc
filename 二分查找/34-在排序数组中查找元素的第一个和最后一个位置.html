<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34-在排序数组中查找元素的第一个和最后一个位置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:20px;margin-bottom:16px}
.container{display:flex;gap:20px;width:100%;max-width:1200px;flex-wrap:wrap}
.panel{background:#16213e;border-radius:12px;padding:16px;flex:1;min-width:340px}
.panel-title{color:#16c79a;font-size:16px;font-weight:bold;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:#c73650;transform:scale(1.05)}
button:disabled{background:#555;cursor:not-allowed;transform:none}
.info-box{background:#0f3460;border-radius:8px;padding:12px;margin-top:12px;min-height:60px}
.step-info{color:#16c79a;font-size:14px;line-height:1.8}
.array-bar{display:flex;gap:3px;margin:12px 0;justify-content:center;align-items:flex-end}
.arr-cell{width:40px;border-radius:4px 4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px;transition:all .3s;font-size:13px;font-weight:bold;font-family:monospace;position:relative}
.arr-cell .val{color:#fff}.arr-cell .idx{font-size:9px;color:#aaa;position:absolute;bottom:-16px}
.arr-cell.in-range{background:#16c79a44;border:2px solid #16c79a33}
.arr-cell.out-range{background:#16213e;border:2px solid #333}
.arr-cell.left-ptr{border-bottom:3px solid #16c79a}
.arr-cell.right-ptr{border-bottom:3px solid #e94560}
.arr-cell.mid-ptr{border-bottom:3px solid #ffd700;background:#ffd70022}
.arr-cell.target{background:#16c79a88;border:2px solid #16c79a}
.ptr-labels{display:flex;gap:3px;justify-content:center}.ptr-label{width:40px;text-align:center;font-size:10px;font-weight:bold}
.ptr-label.left{color:#16c79a}.ptr-label.right{color:#e94560}.ptr-label.mid{color:#ffd700}
.search-mode{margin-top:8px;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:bold;text-align:center}
.search-mode.leftmost{background:#16c79a22;color:#16c79a;border:1px solid #16c79a}
.search-mode.rightmost{background:#e9456022;color:#e94560;border:1px solid #e94560}
.search-info{margin-top:16px;background:#0f3460;border-radius:8px;padding:10px;font-size:13px;line-height:1.8}
.search-info .key{color:#16c79a;font-weight:bold}.search-info .hl{color:#ffd700}
.result-box{margin-top:12px;padding:12px;border-radius:8px;font-size:16px;font-weight:bold;text-align:center;background:#16c79a22;border:1px solid #16c79a;color:#16c79a;display:none}
</style>
</head>
<body>
<h1>34 - 在排序数组中查找元素的第一个和最后一个位置</h1>
<div class="container">
<div class="panel">
<div class="panel-title">数组可视化</div>
<div style="color:#aaa;font-size:13px">nums = [5,7,7,8,8,10]，target = 8</div>
<div class="search-mode leftmost" id="searchMode">搜索最左位置</div>
<div class="ptr-labels" id="ptrLabels"></div>
<div class="array-bar" id="arrayBar"></div>
<div style="height:20px"></div>
<div class="search-info" id="searchInfo">等待开始...</div>
<div class="result-box" id="resultBox"></div>
</div>
<div class="panel">
<div class="panel-title">搜索过程日志</div>
<canvas id="logCanvas" width="480" height="400"></canvas>
</div>
</div>
<div class="info-box" id="infoBox"><span class="step-info">点击 ▶播放 开始动画演示</span></div>
<div class="controls">
<button id="btnPlay" onclick="play()">▶播放</button>
<button id="btnPause" onclick="pause()" disabled>⏸暂停</button>
<button id="btnReset" onclick="reset()">⏮重置</button>
<button id="btnPrev" onclick="prevStep()" disabled>◀步骤后退</button>
<button id="btnNext" onclick="nextStep()" disabled>步骤前进▶</button>
<span id="stepCounter" style="color:#aaa;font-size:14px;line-height:36px;margin-left:10px">步骤: 0/0</span>
</div>
<script>
const NUMS=[5,7,7,8,8,10];
const TARGET=8;
const canvas=document.getElementById('logCanvas');
const ctx=canvas.getContext('2d');
let steps=[];let currentStep=0;let playing=false;let timer=null;

function buildArray(left,right,mid,targets,mode){
  const bar=document.getElementById('arrayBar');bar.innerHTML='';
  const labels=document.getElementById('ptrLabels');labels.innerHTML='';
  NUMS.forEach((v,i)=>{
    const inRange=i>=left&&i<=right;
    const isL=i===left;const isR=i===right;const isM=i===mid;
    const isT=targets&&targets.includes(i);
    let cls=inRange?'in-range':'out-range';
    if(isT)cls='target';else if(isM)cls='mid-ptr';else if(isL)cls='left-ptr';else if(isR)cls='right-ptr';
    const h=20+v*8;
    bar.innerHTML+=`<div class="arr-cell ${cls}" style="height:${h}px"><span class="val">${v}</span><span class="idx">${i}</span></div>`;
    let lbl='';if(isL)lbl='L';if(isR)lbl+=(lbl?'/':'')+'R';if(isM)lbl+=(lbl?'/':'')+'M';
    const lc=lbl.includes('M')?'mid':lbl.includes('L')?'left':lbl.includes('R')?'right':'';
    labels.innerHTML+=`<div class="ptr-label ${lc}">${lbl||' '}</div>`;
  });
  const sm=document.getElementById('searchMode');
  sm.className='search-mode '+(mode==='left'?'leftmost':'rightmost');
  sm.textContent=mode==='left'?'搜索最左位置':'搜索最右位置';
}

function generateSteps(){
  steps=[];
  // First binary search: find leftmost
  steps.push({type:'start_left',left:0,right:NUMS.length-1,mid:-1,targets:[],mode:'left',
    desc:'第一次二分：搜索 target 的最左位置'});
  let left=0,right=NUMS.length-1;
  while(left<=right){
    const mid=Math.floor((left+right)/2);
    steps.push({type:'compare',left,right,mid,targets:[],mode:'left',
      desc:`left=${left}, right=${right}, mid=${mid}, nums[mid]=${NUMS[mid]}`});
    if(NUMS[mid]<TARGET){
      steps.push({type:'go_right',left,right,mid,targets:[],mode:'left',newLeft:mid+1,newRight:right,
        desc:`nums[${mid}]=${NUMS[mid]} < ${TARGET}，left = ${mid+1}`});
      left=mid+1;
    }else{
      steps.push({type:'go_left',left,right,mid,targets:[],mode:'left',newLeft:left,newRight:mid-1,
        desc:`nums[${mid}]=${NUMS[mid]} >= ${TARGET}，right = ${mid-1}（继续左移找最左）`});
      right=mid-1;
    }
  }
  const leftResult=left<NUMS.length&&NUMS[left]===TARGET?left:-1;
  steps.push({type:'found_left',left,right,mid:-1,targets:leftResult>=0?[leftResult]:[],mode:'left',leftResult,
    desc:`最左位置 = ${leftResult}`});

  // Second binary search: find rightmost
  steps.push({type:'start_right',left:0,right:NUMS.length-1,mid:-1,targets:leftResult>=0?[leftResult]:[],mode:'right',
    desc:'第二次二分：搜索 target 的最右位置'});
  left=0;right=NUMS.length-1;
  while(left<=right){
    const mid=Math.floor((left+right)/2);
    steps.push({type:'compare',left,right,mid,targets:leftResult>=0?[leftResult]:[],mode:'right',
      desc:`left=${left}, right=${right}, mid=${mid}, nums[mid]=${NUMS[mid]}`});
    if(NUMS[mid]>TARGET){
      steps.push({type:'go_left',left,right,mid,targets:leftResult>=0?[leftResult]:[],mode:'right',newLeft:left,newRight:mid-1,
        desc:`nums[${mid}]=${NUMS[mid]} > ${TARGET}，right = ${mid-1}`});
      right=mid-1;
    }else{
      steps.push({type:'go_right',left,right,mid,targets:leftResult>=0?[leftResult]:[],mode:'right',newLeft:mid+1,newRight:right,
        desc:`nums[${mid}]=${NUMS[mid]} <= ${TARGET}，left = ${mid+1}（继续右移找最右）`});
      left=mid+1;
    }
  }
  const rightResult=right>=0&&NUMS[right]===TARGET?right:-1;
  steps.push({type:'done',left:0,right:0,mid:-1,targets:leftResult>=0&&rightResult>=0?[leftResult,rightResult]:[],mode:'right',leftResult,rightResult,
    desc:`结果: [${leftResult}, ${rightResult}]`});
}

function drawLog(step){
  ctx.clearRect(0,0,480,400);
  const x0=20,y0=20,lh=28;
  ctx.font='11px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  let y=y0;
  for(let i=Math.max(0,currentStep-12);i<=currentStep&&i<steps.length;i++){
    const s=steps[i];const isCur=i===currentStep;
    const isLeftMode=s.mode==='left';
    ctx.fillStyle=isCur?'#e94560':isLeftMode?'#16c79a88':'#e9456088';
    if(isCur){ctx.fillStyle='#1a1a2e';ctx.fillRect(10,y-11,460,22);ctx.fillStyle=isLeftMode?'#16c79a':'#e94560';}
    const prefix=isLeftMode?'[左]':'[右]';
    ctx.fillText(prefix+' '+s.desc.slice(0,46),x0,y);
    y+=lh;if(y>380)break;
  }
}

function updateUI(step){
  if(!step)return;
  buildArray(step.left,step.right,step.mid,step.targets,step.mode);
  document.getElementById('searchInfo').innerHTML=
    `<span class="key">L=${step.left}</span> <span class="hl">M=${step.mid}</span> <span class="key" style="color:#e94560">R=${step.right}</span><br>nums[${step.mid}]=${step.mid>=0?NUMS[step.mid]:'-'} vs target=${TARGET}`;
  const rb=document.getElementById('resultBox');
  if(step.type==='done'){rb.style.display='block';rb.textContent=`结果: [${step.leftResult}, ${step.rightResult}]`;}
  else if(step.type==='found_left'){rb.style.display='block';rb.className='result-box';rb.style.background='#16c79a22';rb.textContent=`最左位置: ${step.leftResult}`;}
  else{rb.style.display='none';}
  document.getElementById('infoBox').innerHTML=`<span class="step-info">${step.desc}</span>`;
  drawLog(step);
  document.getElementById('stepCounter').textContent=`步骤: ${currentStep+1}/${steps.length}`;
}

function play(){if(currentStep>=steps.length-1)reset();playing=true;
  document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  document.getElementById('btnNext').disabled=true;document.getElementById('btnPrev').disabled=true;
  timer=setInterval(()=>{if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}else pause();},800);}
function pause(){playing=false;clearInterval(timer);
  document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true;
  document.getElementById('btnNext').disabled=currentStep>=steps.length-1;document.getElementById('btnPrev').disabled=currentStep<=0;}
function reset(){pause();currentStep=0;
  buildArray(0,NUMS.length-1,-1,[],'left');
  document.getElementById('searchInfo').textContent='等待开始...';
  document.getElementById('resultBox').style.display='none';
  document.getElementById('infoBox').innerHTML='<span class="step-info">点击 ▶播放 开始动画演示</span>';
  ctx.clearRect(0,0,480,400);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',180,200);
  document.getElementById('stepCounter').textContent='步骤: 0/0';
  document.getElementById('btnPrev').disabled=true;document.getElementById('btnNext').disabled=false;
  generateSteps();}
function nextStep(){if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
function prevStep(){if(currentStep>0){currentStep--;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
generateSteps();buildArray(0,NUMS.length-1,-1,[],'left');
</script>
</body>
</html>
