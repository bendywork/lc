<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35-搜索插入位置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:22px;margin-bottom:16px}
.container{display:flex;gap:20px;width:100%;max-width:1200px;flex-wrap:wrap}
.panel{background:#16213e;border-radius:12px;padding:16px;flex:1;min-width:340px}
.panel-title{color:#16c79a;font-size:16px;font-weight:bold;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:#c73650;transform:scale(1.05)}
button:disabled{background:#555;cursor:not-allowed;transform:none}
.info-box{background:#0f3460;border-radius:8px;padding:12px;margin-top:12px;min-height:60px}
.step-info{color:#16c79a;font-size:14px;line-height:1.8}
.array-bar{display:flex;gap:4px;margin:20px 0;justify-content:center;align-items:flex-end}
.arr-cell{width:52px;border-radius:6px 6px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px;transition:all .3s;font-size:16px;font-weight:bold;font-family:monospace;position:relative}
.arr-cell .val{color:#fff}.arr-cell .idx{font-size:10px;color:#aaa;position:absolute;bottom:-18px}
.arr-cell.in-range{background:#16c79a44;border:2px solid #16c79a33}
.arr-cell.out-range{background:#16213e;border:2px solid #333}
.arr-cell.left-ptr{border-bottom:4px solid #16c79a}
.arr-cell.right-ptr{border-bottom:4px solid #e94560}
.arr-cell.mid-ptr{border-bottom:4px solid #ffd700;background:#ffd70022}
.arr-cell.insert{background:#16c79a88;border:2px solid #16c79a}
.ptr-labels{display:flex;gap:4px;justify-content:center}.ptr-label{width:52px;text-align:center;font-size:11px;font-weight:bold}
.ptr-label.left{color:#16c79a}.ptr-label.right{color:#e94560}.ptr-label.mid{color:#ffd700}
.search-detail{margin-top:24px;background:#0f3460;border-radius:8px;padding:12px;font-size:14px;line-height:2}
.search-detail .key{color:#16c79a;font-weight:bold}.search-detail .hl{color:#ffd700;font-weight:bold}
.search-detail .red{color:#e94560;font-weight:bold}
.result-box{margin-top:16px;padding:14px;border-radius:8px;font-size:18px;font-weight:bold;text-align:center;background:#16c79a22;border:1px solid #16c79a;color:#16c79a;display:none}
.insert-marker{display:flex;gap:4px;margin-top:4px;justify-content:center}
.marker{width:52px;text-align:center;font-size:10px;color:#16c79a;font-weight:bold}
</style>
</head>
<body>
<h1>35 - 搜索插入位置</h1>
<div class="container">
<div class="panel">
<div class="panel-title">数组 & 搜索空间</div>
<div style="color:#aaa;font-size:13px">nums = [1,3,5,6]，target = 5</div>
<div class="ptr-labels" id="ptrLabels"></div>
<div class="array-bar" id="arrayBar"></div>
<div class="insert-marker" id="insertMarker"></div>
<div style="height:10px"></div>
<div class="search-detail" id="searchDetail">等待开始...</div>
<div class="result-box" id="resultBox"></div>
</div>
<div class="panel">
<div class="panel-title">二分查找过程</div>
<canvas id="logCanvas" width="480" height="400"></canvas>
</div>
</div>
<div class="info-box" id="infoBox"><span class="step-info">点击 ▶播放 开始动画演示</span></div>
<div class="controls">
<button id="btnPlay" onclick="play()">▶播放</button>
<button id="btnPause" onclick="pause()" disabled>⏸暂停</button>
<button id="btnReset" onclick="reset()">⏮重置</button>
<button id="btnPrev" onclick="prevStep()" disabled>◀步骤后退</button>
<button id="btnNext" onclick="nextStep()" disabled>步骤前进▶</button>
<span id="stepCounter" style="color:#aaa;font-size:14px;line-height:36px;margin-left:10px">步骤: 0/0</span>
</div>
<script>
const NUMS=[1,3,5,6];
const TARGET=5;
const canvas=document.getElementById('logCanvas');
const ctx=canvas.getContext('2d');
let steps=[];let currentStep=0;let playing=false;let timer=null;

function buildArray(left,right,mid,insertIdx){
  const bar=document.getElementById('arrayBar');bar.innerHTML='';
  const labels=document.getElementById('ptrLabels');labels.innerHTML='';
  const marker=document.getElementById('insertMarker');marker.innerHTML='';
  NUMS.forEach((v,i)=>{
    const inRange=i>=left&&i<=right;
    const isL=i===left;const isR=i===right;const isM=i===mid;const isIns=i===insertIdx;
    let cls=inRange?'in-range':'out-range';
    if(isIns)cls='insert';else if(isM)cls='mid-ptr';else if(isL)cls='left-ptr';else if(isR)cls='right-ptr';
    const h=30+v*14;
    bar.innerHTML+=`<div class="arr-cell ${cls}" style="height:${h}px"><span class="val">${v}</span><span class="idx">${i}</span></div>`;
    let lbl='';if(isL)lbl='L';if(isR)lbl+=(lbl?'/':'')+'R';if(isM)lbl+=(lbl?'/':'')+'M';
    const lc=lbl.includes('M')?'mid':lbl.includes('L')?'left':lbl.includes('R')?'right':'';
    labels.innerHTML+=`<div class="ptr-label ${lc}">${lbl||' '}</div>`;
    marker.innerHTML+=`<div class="marker">${isIns?'↑ 插入':''}</div>`;
  });
}

function generateSteps(){
  steps=[];
  let left=0,right=NUMS.length-1;
  steps.push({type:'start',left,right,mid:-1,insertIdx:-1,
    desc:`开始二分查找，target=${TARGET}，范围 [${left}, ${right}]`});
  while(left<=right){
    const mid=Math.floor((left+right)/2);
    steps.push({type:'compare',left,right,mid,insertIdx:-1,
      desc:`left=${left}, right=${right}, mid=${mid}, nums[${mid}]=${NUMS[mid]}`});
    if(NUMS[mid]===TARGET){
      steps.push({type:'found',left,right,mid,insertIdx:mid,
        desc:`nums[${mid}]=${NUMS[mid]} === target=${TARGET}，找到！索引=${mid}`});
      return;
    }else if(NUMS[mid]<TARGET){
      steps.push({type:'go_right',left,right,mid,insertIdx:-1,
        desc:`nums[${mid}]=${NUMS[mid]} < ${TARGET}，target 在右半，left = ${mid+1}`});
      left=mid+1;
    }else{
      steps.push({type:'go_left',left,right,mid,insertIdx:-1,
        desc:`nums[${mid}]=${NUMS[mid]} > ${TARGET}，target 在左半，right = ${mid-1}`});
      right=mid-1;
    }
  }
  steps.push({type:'insert',left,right,mid:-1,insertIdx:left,
    desc:`未找到，插入位置 = left = ${left}`});
}

function drawLog(step){
  ctx.clearRect(0,0,480,400);
  const x0=20,y0=25,lh=34;
  ctx.font='12px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  let y=y0;
  for(let i=0;i<=currentStep&&i<steps.length;i++){
    const s=steps[i];const isCur=i===currentStep;
    const icons={start:'▶',compare:'⟷',go_right:'►',go_left:'◄',found:'★',insert:'⊕'};
    const icon=icons[s.type]||'·';
    ctx.fillStyle=isCur?'#e94560':s.type==='found'?'#16c79a':s.type==='insert'?'#ffd700':'#888';
    if(isCur){ctx.fillStyle='#1a1a2e';ctx.fillRect(10,y-13,460,26);ctx.fillStyle='#e94560';}
    ctx.fillText(icon+' '+s.desc.slice(0,46),x0,y);
    y+=lh;if(y>380)break;
  }
}

function updateUI(step){
  if(!step)return;
  buildArray(step.left,step.right,step.mid,step.insertIdx);
  document.getElementById('searchDetail').innerHTML=
    `<span class="key">left = ${step.left}</span> | <span class="hl">mid = ${step.mid}</span> | <span class="red">right = ${step.right}</span><br>`+
    `搜索空间: [${step.left}, ${step.right}]，共 ${Math.max(0,step.right-step.left+1)} 个元素<br>`+
    `nums[${step.mid}] = ${step.mid>=0?NUMS[step.mid]:'-'} ${step.mid>=0?(NUMS[step.mid]<TARGET?'<':NUMS[step.mid]>TARGET?'>':'==')+' '+TARGET:''}`;
  const rb=document.getElementById('resultBox');
  if(step.type==='found'){rb.style.display='block';rb.textContent=`找到！索引 = ${step.mid}`;}
  else if(step.type==='insert'){rb.style.display='block';rb.textContent=`插入位置 = ${step.insertIdx}`;}
  else{rb.style.display='none';}
  document.getElementById('infoBox').innerHTML=`<span class="step-info">${step.desc}</span>`;
  drawLog(step);
  document.getElementById('stepCounter').textContent=`步骤: ${currentStep+1}/${steps.length}`;
}

function play(){if(currentStep>=steps.length-1)reset();playing=true;
  document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  document.getElementById('btnNext').disabled=true;document.getElementById('btnPrev').disabled=true;
  timer=setInterval(()=>{if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}else pause();},900);}
function pause(){playing=false;clearInterval(timer);
  document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true;
  document.getElementById('btnNext').disabled=currentStep>=steps.length-1;document.getElementById('btnPrev').disabled=currentStep<=0;}
function reset(){pause();currentStep=0;
  buildArray(0,NUMS.length-1,-1,-1);
  document.getElementById('searchDetail').textContent='等待开始...';
  document.getElementById('resultBox').style.display='none';
  document.getElementById('infoBox').innerHTML='<span class="step-info">点击 ▶播放 开始动画演示</span>';
  ctx.clearRect(0,0,480,400);ctx.fillStyle='#aaa';ctx.font='16px Microsoft YaHei';ctx.fillText('等待开始...',180,200);
  document.getElementById('stepCounter').textContent='步骤: 0/0';
  document.getElementById('btnPrev').disabled=true;document.getElementById('btnNext').disabled=false;
  generateSteps();}
function nextStep(){if(currentStep<steps.length-1){currentStep++;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
function prevStep(){if(currentStep>0){currentStep--;updateUI(steps[currentStep]);}
  document.getElementById('btnPrev').disabled=currentStep<=0;document.getElementById('btnNext').disabled=currentStep>=steps.length-1;}
generateSteps();buildArray(0,NUMS.length-1,-1,-1);
</script>
</body>
</html>
