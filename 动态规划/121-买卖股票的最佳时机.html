<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>121 - 买卖股票的最佳时机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:1.6rem;margin-bottom:8px}
.subtitle{color:#16c79a;font-size:.95rem;margin-bottom:16px}
#canvas-wrap{background:#16213e;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
canvas{display:block}
#desc-panel{background:#16213e;border-radius:10px;padding:14px 20px;width:800px;margin-bottom:12px;min-height:70px;border-left:4px solid #e94560}
#desc-panel .step-num{color:#16c79a;font-weight:bold;font-size:1.1rem}
#desc-panel .formula{color:#e94560;font-family:'Courier New',monospace;font-size:1rem;margin-top:6px}
#desc-panel .explain{color:#b0b0b0;margin-top:4px;font-size:.9rem}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#0f3460;color:#e0e0e0;border:2px solid #e94560;border-radius:8px;padding:8px 18px;font-size:1rem;cursor:pointer;transition:all .2s}
button:hover{background:#e94560;color:#fff}
button:active{transform:scale(.95)}
#speed-label{color:#16c79a;font-size:.9rem}
#speed{width:80px;accent-color:#e94560}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>LeetCode 121 - 买卖股票的最佳时机</h1>
<p class="subtitle">动态规划 · 跟踪最低价格与最大利润</p>
<div id="canvas-wrap"><canvas id="cv" width="800" height="480"></canvas></div>
<div id="desc-panel">
  <div class="step-num">步骤 0 / 0</div>
  <div class="formula"></div>
  <div class="explain">点击 ▶ 或步骤按钮开始动画</div>
</div>
<div id="controls">
  <button id="btn-reset">⏮ 重置</button>
  <button id="btn-prev">◀ 上一步</button>
  <button id="btn-play">▶ 播放</button>
  <button id="btn-next">▶ 下一步</button>
  <span id="speed-label">速度</span>
  <input type="range" id="speed" min="1" max="10" value="4">
</div>
<div class="legend">
  <span><span class="dot" style="background:#16c79a"></span>最低价日</span>
  <span><span class="dot" style="background:#e94560"></span>卖出日</span>
  <span><span class="dot" style="background:#533483"></span>已扫描</span>
  <span><span class="dot" style="background:#0f3460"></span>未扫描</span>
</div>
<script>
const prices=[7,1,5,3,6,4];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=480;
let steps=[],curStep=-1,playing=false,playTimer=null;
const speedEl=document.getElementById('speed');

function buildSteps(){
  steps=[];
  let minP=prices[0],maxProfit=0,minIdx=0,sellIdx=-1,bestMinIdx=0;
  steps.push({i:0,minP,maxProfit,minIdx,sellIdx,bestMinIdx,desc:'初始化',formula:`min_price = ${prices[0]}, max_profit = 0`});
  for(let i=1;i<prices.length;i++){
    // update min
    if(prices[i]<minP){
      const oldMin=minP;
      minP=prices[i];minIdx=i;
      steps.push({i,minP,maxProfit,minIdx,sellIdx,bestMinIdx,desc:'发现更低价格，更新最低价',formula:`min_price = min(${oldMin}, prices[${i}]) = min(${oldMin}, ${prices[i]}) = ${minP}`});
    }
    // calc profit
    const profit=prices[i]-minP;
    if(profit>maxProfit){
      maxProfit=profit;sellIdx=i;bestMinIdx=minIdx;
      steps.push({i,minP,maxProfit,minIdx,sellIdx,bestMinIdx,desc:'发现更大利润，更新最大利润',formula:`max_profit = max(${maxProfit-profit+profit}, prices[${i}] - min_price) = ${prices[i]} - ${minP} = ${maxProfit}`});
    }else{
      steps.push({i,minP,maxProfit,minIdx,sellIdx,bestMinIdx,desc:'利润未提升，保持不变',formula:`prices[${i}] - min_price = ${prices[i]} - ${minP} = ${profit} ≤ ${maxProfit}，不更新`});
    }
  }
  steps.push({i:prices.length-1,minP,maxProfit,minIdx,sellIdx,bestMinIdx,desc:'遍历结束',formula:`最大利润 = ${maxProfit}（第${bestMinIdx}天买入，第${sellIdx}天卖出）`});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:null;
  const idx=s?s.i:-1;
  const minP=s?s.minP:prices[0];
  const maxProfit=s?s.maxProfit:0;
  const minIdx=s?s.minIdx:0;
  const sellIdx=s?s.sellIdx:-1;
  const bestMinIdx=s?s.bestMinIdx:0;

  const chartX=70,chartY=30,chartW=660,chartH=240;
  const maxPrice=Math.max(...prices)+1;
  const barW=chartW/prices.length;

  // chart background
  ctx.fillStyle='#0f346022';ctx.fillRect(chartX,chartY,chartW,chartH);

  // grid lines
  ctx.strokeStyle='#ffffff11';ctx.lineWidth=1;
  for(let v=0;v<=maxPrice;v+=2){
    const y=chartY+chartH-(v/maxPrice*chartH);
    ctx.beginPath();ctx.moveTo(chartX,y);ctx.lineTo(chartX+chartW,y);ctx.stroke();
    ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText(v,chartX-8,y+4);
  }

  // price bars
  for(let i=0;i<prices.length;i++){
    const bx=chartX+i*barW+barW*0.15;
    const bh=prices[i]/maxPrice*chartH;
    const by=chartY+chartH-bh;
    const bw2=barW*0.7;
    let bg='#0f3460';
    if(s&&i<=idx)bg='#533483';
    if(i===minIdx&&s)bg='#16c79a';
    if(i===sellIdx&&s&&sellIdx>=0)bg='#e94560';

    ctx.fillStyle=bg;
    ctx.fillRect(bx,by,bw2,bh);
    ctx.strokeStyle=i===minIdx?'#16c79a':i===sellIdx?'#e94560':'#333';
    ctx.lineWidth=i===minIdx||i===sellIdx?2.5:1;
    ctx.strokeRect(bx,by,bw2,bh);

    // price label
    ctx.fillStyle='#e0e0e0';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(prices[i],bx+bw2/2,by-6);
    // day label
    ctx.fillStyle='#888';ctx.font='11px sans-serif';
    ctx.fillText('第'+i+'天',bx+bw2/2,chartY+chartH+16);
  }

  // min price line
  if(s){
    const minY=chartY+chartH-(minP/maxPrice*chartH);
    ctx.strokeStyle='#16c79a';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(chartX,minY);ctx.lineTo(chartX+chartW,minY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#16c79a';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText('min_price = '+minP,chartX+chartW+8,minY+4);
  }

  // profit arrow
  if(s&&sellIdx>=0){
    const buyY=chartY+chartH-(prices[bestMinIdx]/maxPrice*chartH);
    const sellY=chartY+chartH-(prices[sellIdx]/maxPrice*chartH);
    const ax=chartX+bestMinIdx*barW+barW/2;
    const bx2=chartX+sellIdx*barW+barW/2;
    // draw line connecting buy and sell
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(ax,buyY);ctx.lineTo(bx2,sellY);ctx.stroke();
    ctx.setLineDash([]);
    // profit label
    ctx.fillStyle='#e94560';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    const mx=(ax+bx2)/2,my=(buyY+sellY)/2;
    ctx.fillText('利润 = '+maxProfit,mx,my-10);
  }

  // bottom info panel
  const infoY=chartY+chartH+40;
  ctx.fillStyle='#16213e';ctx.fillRect(chartX,infoY,chartW,80);
  ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(chartX,infoY,chartW,80);

  ctx.textAlign='left';
  ctx.fillStyle='#16c79a';ctx.font='bold 16px sans-serif';
  ctx.fillText('min_price = '+minP,chartX+20,infoY+30);
  ctx.fillStyle='#e94560';
  ctx.fillText('max_profit = '+maxProfit,chartX+240,infoY+30);
  ctx.fillStyle='#e0e0e0';ctx.font='14px sans-serif';
  ctx.fillText(sellIdx>=0?`买入日: ${bestMinIdx} (价格${prices[bestMinIdx]}) → 卖出日: ${sellIdx} (价格${prices[sellIdx]})`:'暂无交易',chartX+20,infoY+60);
}

function updateDesc(){
  const panel=document.getElementById('desc-panel');
  if(curStep<0){panel.innerHTML=`<div class="step-num">步骤 0 / ${steps.length}</div><div class="explain">点击 ▶ 或步骤按钮开始动画</div>`;return;}
  const s=steps[curStep];
  panel.innerHTML=`<div class="step-num">步骤 ${curStep+1} / ${steps.length}</div><div class="formula">${s.formula}</div><div class="explain">i=${s.i} · ${s.desc}</div>`;
}

function stepForward(){if(curStep<steps.length-1){curStep++;draw();updateDesc();}else stopPlay();}
function stepBack(){if(curStep>0){curStep--;draw();updateDesc();}else{curStep=-1;draw();updateDesc();}}
function startPlay(){if(playing)return;if(curStep>=steps.length-1)curStep=-1;playing=true;document.getElementById('btn-play').textContent='⏸ 暂停';tick();}
function tick(){if(!playing)return;stepForward();if(curStep>=steps.length-1){stopPlay();return;}playTimer=setTimeout(tick,1200/speedEl.value);}
function stopPlay(){playing=false;clearTimeout(playTimer);document.getElementById('btn-play').textContent='▶ 播放';}
function reset(){stopPlay();curStep=-1;draw();updateDesc();}

document.getElementById('btn-play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('btn-next').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btn-prev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btn-reset').onclick=reset;

buildSteps();draw();updateDesc();
</script>
</body>
</html>
