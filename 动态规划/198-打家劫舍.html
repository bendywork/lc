<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>198 - 打家劫舍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:1.6rem;margin-bottom:8px}
.subtitle{color:#16c79a;font-size:.95rem;margin-bottom:16px}
#canvas-wrap{background:#16213e;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
canvas{display:block}
#desc-panel{background:#16213e;border-radius:10px;padding:14px 20px;width:800px;margin-bottom:12px;min-height:70px;border-left:4px solid #e94560}
#desc-panel .step-num{color:#16c79a;font-weight:bold;font-size:1.1rem}
#desc-panel .formula{color:#e94560;font-family:'Courier New',monospace;font-size:1rem;margin-top:6px}
#desc-panel .explain{color:#b0b0b0;margin-top:4px;font-size:.9rem}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#0f3460;color:#e0e0e0;border:2px solid #e94560;border-radius:8px;padding:8px 18px;font-size:1rem;cursor:pointer;transition:all .2s}
button:hover{background:#e94560;color:#fff}
button:active{transform:scale(.95)}
#speed-label{color:#16c79a;font-size:.9rem}
#speed{width:80px;accent-color:#e94560}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>LeetCode 198 - 打家劫舍</h1>
<p class="subtitle">动态规划 · dp[i] = max(dp[i-1], dp[i-2] + nums[i])</p>
<div id="canvas-wrap"><canvas id="cv" width="800" height="500"></canvas></div>
<div id="desc-panel">
  <div class="step-num">步骤 0 / 0</div>
  <div class="formula"></div>
  <div class="explain">点击 ▶ 或步骤按钮开始动画</div>
</div>
<div id="controls">
  <button id="btn-reset">⏮ 重置</button>
  <button id="btn-prev">◀ 上一步</button>
  <button id="btn-play">▶ 播放</button>
  <button id="btn-next">▶ 下一步</button>
  <span id="speed-label">速度</span>
  <input type="range" id="speed" min="1" max="10" value="4">
</div>
<div class="legend">
  <span><span class="dot" style="background:#16c79a"></span>当前房屋(劫)</span>
  <span><span class="dot" style="background:#e94560"></span>跳过(不劫)</span>
  <span><span class="dot" style="background:#533483"></span>已决定</span>
  <span><span class="dot" style="background:#0f3460"></span>未处理</span>
</div>
<script>
const nums=[2,7,9,3,1];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=500;
let steps=[],curStep=-1,playing=false,playTimer=null;
const speedEl=document.getElementById('speed');

function buildSteps(){
  steps=[];
  const dp=new Array(nums.length).fill(0);
  const robbed=new Array(nums.length).fill(false);
  // step 0: init
  dp[0]=nums[0];robbed[0]=true;
  steps.push({i:0,dp:[...dp],robbed:[...robbed],desc:'第0家：只能偷',formula:`dp[0] = nums[0] = ${nums[0]}`,choice:'rob'});
  if(nums.length>1){
    if(nums[1]>nums[0]){
      dp[1]=nums[1];robbed[1]=true;robbed[0]=false;
      steps.push({i:1,dp:[...dp],robbed:[...robbed],desc:'第1家：偷第1家比偷第0家更优',formula:`dp[1] = max(dp[0], nums[1]) = max(${nums[0]}, ${nums[1]}) = ${dp[1]}`,choice:'rob'});
    }else{
      dp[1]=nums[0];robbed[0]=true;robbed[1]=false;
      steps.push({i:1,dp:[...dp],robbed:[...robbed],desc:'第1家：偷第0家比偷第1家更优',formula:`dp[1] = max(dp[0], nums[1]) = max(${nums[0]}, ${nums[1]}) = ${dp[1]}`,choice:'skip'});
    }
  }
  for(let i=2;i<nums.length;i++){
    const robVal=dp[i-2]+nums[i];
    const skipVal=dp[i-1];
    if(robVal>skipVal){
      dp[i]=robVal;
      // rebuild robbed status
      const newRobbed=new Array(nums.length).fill(false);
      // trace back to find optimal path
      const tempRobbed=tracePath(dp,nums,i);
      steps.push({i,dp:[...dp],robbed:[...tempRobbed],desc:'偷第'+i+'家更优（dp[i-2]+nums[i] > dp[i-1]）',formula:`dp[${i}] = max(dp[${i-1}], dp[${i-2}]+nums[${i}]) = max(${skipVal}, ${dp[i-2]}+${nums[i]}) = ${dp[i]}`,choice:'rob'});
    }else{
      dp[i]=skipVal;
      const tempRobbed=tracePath(dp,nums,i);
      steps.push({i,dp:[...dp],robbed:[...tempRobbed],desc:'不偷第'+i+'家更优（dp[i-1] >= dp[i-2]+nums[i]）',formula:`dp[${i}] = max(dp[${i-1}], dp[${i-2}]+nums[${i}]) = max(${skipVal}, ${dp[i-2]}+${nums[i]}) = ${dp[i]}`,choice:'skip'});
    }
  }
  const finalRobbed=tracePath(dp,nums,nums.length-1);
  steps.push({i:nums.length-1,dp:[...dp],robbed:[...finalRobbed],desc:'计算完毕',formula:`最大金额 = dp[${nums.length-1}] = ${dp[nums.length-1]}`});
}

function tracePath(dp,nums,end){
  const robbed=new Array(nums.length).fill(false);
  let i=end;
  while(i>=0){
    if(i===0){robbed[0]=dp[0]>0;break;}
    if(i===1){robbed[1]=dp[1]===nums[1];robbed[0]=dp[1]===nums[0];break;}
    if(dp[i]===dp[i-2]+nums[i]){robbed[i]=true;i-=2;}
    else{i-=1;}
  }
  return robbed;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:null;
  const dp=s?s.dp:new Array(nums.length).fill(0);
  const robbed=s?s.robbed:new Array(nums.length).fill(false);
  const ci=s?s.i:-1;

  // Draw houses
  const houseW=100,houseH=100,gap=30;
  const totalW=nums.length*houseW+(nums.length-1)*gap;
  const startX=(W-totalW)/2;
  const houseY=60;

  ctx.fillStyle='#e0e0e0';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText('房屋',W/2,30);

  for(let i=0;i<nums.length;i++){
    const x=startX+i*(houseW+gap);
    // house body
    let bodyColor='#0f3460';
    if(s&&i<=ci){
      if(robbed[i])bodyColor='#16c79a44';
      else bodyColor='#e9456022';
    }
    if(i===ci)bodyColor=robbed[i]?'#16c79a66':'#e9456044';

    ctx.fillStyle=bodyColor;
    ctx.fillRect(x,houseY,houseW,houseH);
    ctx.strokeStyle=i===ci?'#16c79a':'#444';ctx.lineWidth=i===ci?3:1;
    ctx.strokeRect(x,houseY,houseW,houseH);

    // roof
    ctx.fillStyle=s&&robbed[i]&&i<=ci?'#16c79a':'#533483';
    ctx.beginPath();ctx.moveTo(x-10,houseY);ctx.lineTo(x+houseW/2,houseY-30);ctx.lineTo(x+houseW+10,houseY);ctx.closePath();ctx.fill();

    // money inside
    ctx.fillStyle='#e0e0e0';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText('$'+nums[i],x+houseW/2,houseY+houseH/2+8);

    // status label
    if(s&&i<=ci){
      ctx.font='bold 12px sans-serif';
      if(robbed[i]){
        ctx.fillStyle='#16c79a';ctx.fillText('劫',x+houseW/2,houseY+houseH+18);
      }else{
        ctx.fillStyle='#e94560';ctx.fillText('跳',x+houseW/2,houseY+houseH+18);
      }
    }
    // index
    ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.fillText(i,x+houseW/2,houseY+houseH+34);
  }

  // DP table
  const tblY=houseY+houseH+60;
  const cellW2=houseW+gap-6,cellH2=40,gap2=6;
  ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('DP 表格',startX,tblY-10);

  for(let i=0;i<nums.length;i++){
    const x=startX+i*(cellW2+gap2),y=tblY;
    let bg='#0f3460';
    if(s&&dp[i]>0)bg='#533483';
    if(i===ci)bg='#16c79a';
    if(s&&i===ci-1&&ci>=1)bg='#e94560';
    if(s&&i===ci-2&&ci>=2)bg='#e94560';

    ctx.fillStyle=bg;
    ctx.beginPath();ctx.roundRect(x,y,cellW2,cellH2,6);ctx.fill();
    ctx.strokeStyle=i===ci?'#16c79a':'#333';ctx.lineWidth=i===ci?2.5:1;ctx.stroke();
    ctx.fillStyle='#e0e0e0';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText(dp[i]||'-',x+cellW2/2,y+cellH2/2+6);
    ctx.fillStyle='#888';ctx.font='11px sans-serif';
    ctx.fillText('dp['+i+']',x+cellW2/2,y+cellH2+14);
  }

  // Formula arrows
  if(s&&ci>=2){
    const fromX1=startX+(ci-2)*(cellW2+gap2)+cellW2/2;
    const fromX2=startX+(ci-1)*(cellW2+gap2)+cellW2/2;
    const toX=startX+ci*(cellW2+gap2)+cellW2/2;
    const ay=tblY+cellH2+24;
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(fromX1,ay);ctx.lineTo(toX,ay);ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(fromX2,ay);ctx.lineTo(toX,ay+8);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Decision detail
  if(s&&ci>=0){
    const detY=tblY+cellH2+50;
    ctx.textAlign='left';
    ctx.fillStyle='#16c79a';ctx.font='bold 15px sans-serif';
    if(s.choice==='rob'){
      ctx.fillText(`决策：劫第${ci}家 (dp[${ci-2}]+nums[${ci}] = ${ci>=2?dp[ci-2]:0}+${nums[ci]} = ${dp[ci]})`,startX,detY);
    }else if(s.choice==='skip'){
      ctx.fillText(`决策：跳过第${ci}家 (dp[${ci-1}] = ${ci>=1?dp[ci-1]:0} ≥ dp[${ci-2}]+nums[${ci}])`,startX,detY);
    }
    // Total
    ctx.fillStyle='#e94560';ctx.font='bold 18px sans-serif';
    ctx.fillText(`当前最大金额: ${dp[ci]}`,startX,detY+30);
  }
}

function updateDesc(){
  const panel=document.getElementById('desc-panel');
  if(curStep<0){panel.innerHTML=`<div class="step-num">步骤 0 / ${steps.length}</div><div class="explain">点击 ▶ 或步骤按钮开始动画</div>`;return;}
  const s=steps[curStep];
  panel.innerHTML=`<div class="step-num">步骤 ${curStep+1} / ${steps.length}</div><div class="formula">${s.formula}</div><div class="explain">${s.desc}</div>`;
}

function stepForward(){if(curStep<steps.length-1){curStep++;draw();updateDesc();}else stopPlay();}
function stepBack(){if(curStep>0){curStep--;draw();updateDesc();}else{curStep=-1;draw();updateDesc();}}
function startPlay(){if(playing)return;if(curStep>=steps.length-1)curStep=-1;playing=true;document.getElementById('btn-play').textContent='⏸ 暂停';tick();}
function tick(){if(!playing)return;stepForward();if(curStep>=steps.length-1){stopPlay();return;}playTimer=setTimeout(tick,1200/speedEl.value);}
function stopPlay(){playing=false;clearTimeout(playTimer);document.getElementById('btn-play').textContent='▶ 播放';}
function reset(){stopPlay();curStep=-1;draw();updateDesc();}

document.getElementById('btn-play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('btn-next').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btn-prev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btn-reset').onclick=reset;

buildSteps();draw();updateDesc();
</script>
</body>
</html>
