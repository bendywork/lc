<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>70 - 爬楼梯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:1.6rem;margin-bottom:8px}
.subtitle{color:#16c79a;font-size:.95rem;margin-bottom:16px}
#canvas-wrap{background:#16213e;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
canvas{display:block}
#desc-panel{background:#16213e;border-radius:10px;padding:14px 20px;width:800px;margin-bottom:12px;min-height:70px;border-left:4px solid #e94560}
#desc-panel .step-num{color:#16c79a;font-weight:bold;font-size:1.1rem}
#desc-panel .formula{color:#e94560;font-family:'Courier New',monospace;font-size:1rem;margin-top:6px}
#desc-panel .explain{color:#b0b0b0;margin-top:4px;font-size:.9rem}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#0f3460;color:#e0e0e0;border:2px solid #e94560;border-radius:8px;padding:8px 18px;font-size:1rem;cursor:pointer;transition:all .2s}
button:hover{background:#e94560;color:#fff}
button:active{transform:scale(.95)}
#speed-label{color:#16c79a;font-size:.9rem}
#speed{width:80px;accent-color:#e94560}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>LeetCode 70 - 爬楼梯</h1>
<p class="subtitle">动态规划 · dp[i] = dp[i-1] + dp[i-2]</p>
<div id="canvas-wrap"><canvas id="cv" width="800" height="480"></canvas></div>
<div id="desc-panel">
  <div class="step-num">步骤 0 / 0</div>
  <div class="formula"></div>
  <div class="explain">点击 ▶ 或步骤按钮开始动画</div>
</div>
<div id="controls">
  <button id="btn-reset">⏮ 重置</button>
  <button id="btn-prev">◀ 上一步</button>
  <button id="btn-play">▶ 播放</button>
  <button id="btn-next">▶ 下一步</button>
  <span id="speed-label">速度</span>
  <input type="range" id="speed" min="1" max="10" value="4">
</div>
<div class="legend">
  <span><span class="dot" style="background:#16c79a"></span>当前步骤</span>
  <span><span class="dot" style="background:#e94560"></span>依赖项</span>
  <span><span class="dot" style="background:#0f3460"></span>未填充</span>
  <span><span class="dot" style="background:#533483"></span>已填充</span>
</div>
<script>
const N=8;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=480;
let steps=[],curStep=-1,playing=false,playTimer=null;
const speedEl=document.getElementById('speed');

function buildSteps(){
  steps=[];
  const dp=new Array(N+1).fill(0);
  dp[1]=1;
  steps.push({i:1,dp:[...dp],desc:'初始化：到达第1阶只有1种方法',formula:'dp[1] = 1'});
  dp[2]=2;
  steps.push({i:2,dp:[...dp],desc:'初始化：到达第2阶有2种方法（1+1步 或 2步）',formula:'dp[2] = 2'});
  for(let i=3;i<=N;i++){
    dp[i]=dp[i-1]+dp[i-2];
    steps.push({i,dp:[...dp],desc:`计算第${i}阶的方法数`,formula:`dp[${i}] = dp[${i-1}] + dp[${i-2}] = ${dp[i-1]} + ${dp[i-2]} = ${dp[i]}`});
  }
  steps.push({i:N,dp:[...dp],desc:'计算完成',formula:`结果：到达第${N}阶共有 ${dp[N]} 种方法`});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=curStep>=0?steps[curStep]:null;
  const dp=s?s.dp:new Array(N+1).fill(0);
  const ci=s?s.i:0;

  // Draw staircase
  const stairStartX=80,stairStartY=350,stepW=70,stepH=40;
  ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('楼梯可视化',400,30);

  for(let i=0;i<=N;i++){
    const x=stairStartX+i*stepW;
    const y=stairStartY-i*stepH;
    // stair step
    ctx.fillStyle=i===ci?'#e94560':(s&&i<=ci?'#533483':'#0f3460');
    ctx.fillRect(x-stepW/2,y,stepW-2,stepH-2);
    ctx.strokeStyle=i===ci?'#e94560':'#333';ctx.lineWidth=i===ci?2.5:1;
    ctx.strokeRect(x-stepW/2,y,stepW-2,stepH-2);
    // number of ways
    ctx.fillStyle=i===ci?'#fff':'#e0e0e0';ctx.font='bold 16px sans-serif';
    ctx.fillText(dp[i]||'',x,y+stepH/2+6);
    // step label
    ctx.fillStyle='#888';ctx.font='12px sans-serif';
    ctx.fillText(i,x,y+stepH+14);
  }

  // Draw DP table
  const tblX=60,tblY=40,cellW=80,cellH=36,gap=4;
  ctx.fillStyle='#e0e0e0';ctx.font='bold 13px sans-serif';ctx.textAlign='left';
  ctx.fillText('DP 表格',tblX,tblY-8);

  for(let i=0;i<=N;i++){
    const cx=tblX+i*(cellW+gap),cy=tblY;
    let bg='#0f3460';
    if(s&&dp[i]>0)bg='#533483';
    if(i===ci)bg='#16c79a';
    if(s&&i===ci-1&&ci>=1)bg='#e94560';
    if(s&&i===ci-2&&ci>=2)bg='#e94560';
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.roundRect(cx,cy,cellW,cellH,4);ctx.fill();
    ctx.strokeStyle=i===ci?'#16c79a':'#333';ctx.lineWidth=i===ci?2.5:1;ctx.stroke();
    ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(dp[i]||'-',cx+cellW/2,cy+cellH/2+5);
    ctx.fillStyle='#888';ctx.font='11px sans-serif';
    ctx.fillText('dp['+i+']',cx+cellW/2,cy+cellH+14);
  }

  // Arrows from dp[i-1] and dp[i-2] to dp[i]
  if(s&&ci>=3){
    const fromX1=tblX+(ci-1)*(cellW+gap)+cellW/2;
    const fromX2=tblX+(ci-2)*(cellW+gap)+cellW/2;
    const toX=tblX+ci*(cellW+gap)+cellW/2;
    const ay=tblY+cellH+22;
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(fromX1,ay);ctx.lineTo(toX,ay);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fromX2,ay+12);ctx.lineTo(toX,ay+12);ctx.stroke();
    // arrowheads
    ctx.fillStyle='#e94560';
    ctx.beginPath();ctx.moveTo(toX,ay-5);ctx.lineTo(toX+8,ay);ctx.lineTo(toX,ay+5);ctx.fill();
    ctx.beginPath();ctx.moveTo(toX,ay+7);ctx.lineTo(toX+8,ay+12);ctx.lineTo(toX,ay+17);ctx.fill();
  }

  // Stick figure on current stair
  if(s&&ci>0){
    const fx=stairStartX+ci*stepW;
    const fy=stairStartY-ci*stepH;
    ctx.fillStyle='#16c79a';
    // head
    ctx.beginPath();ctx.arc(fx,fy-24,8,0,Math.PI*2);ctx.fill();
    // body
    ctx.strokeStyle='#16c79a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(fx,fy-16);ctx.lineTo(fx,fy-2);ctx.stroke();
    // legs
    ctx.beginPath();ctx.moveTo(fx,fy-2);ctx.lineTo(fx-8,fy+8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx,fy-2);ctx.lineTo(fx+8,fy+8);ctx.stroke();
    // arms
    ctx.beginPath();ctx.moveTo(fx,fy-12);ctx.lineTo(fx-10,fy-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx,fy-12);ctx.lineTo(fx+10,fy-6);ctx.stroke();
  }
}

function updateDesc(){
  const panel=document.getElementById('desc-panel');
  if(curStep<0){panel.innerHTML=`<div class="step-num">步骤 0 / ${steps.length}</div><div class="explain">点击 ▶ 或步骤按钮开始动画</div>`;return;}
  const s=steps[curStep];
  panel.innerHTML=`<div class="step-num">步骤 ${curStep+1} / ${steps.length}</div><div class="formula">${s.formula}</div><div class="explain">${s.desc}</div>`;
}

function stepForward(){if(curStep<steps.length-1){curStep++;draw();updateDesc();}else stopPlay();}
function stepBack(){if(curStep>0){curStep--;draw();updateDesc();}else{curStep=-1;draw();updateDesc();}}
function startPlay(){if(playing)return;if(curStep>=steps.length-1)curStep=-1;playing=true;document.getElementById('btn-play').textContent='⏸ 暂停';tick();}
function tick(){if(!playing)return;stepForward();if(curStep>=steps.length-1){stopPlay();return;}playTimer=setTimeout(tick,1200/speedEl.value);}
function stopPlay(){playing=false;clearTimeout(playTimer);document.getElementById('btn-play').textContent='▶ 播放';}
function reset(){stopPlay();curStep=-1;draw();updateDesc();}

document.getElementById('btn-play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('btn-next').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btn-prev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btn-reset').onclick=reset;

buildSteps();draw();updateDesc();
</script>
</body>
</html>
