<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1072 - 按列翻转得到最大等值行数</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;font-size:1.6rem;margin-bottom:8px}
.subtitle{color:#16c79a;font-size:.95rem;margin-bottom:16px}
#canvas-wrap{background:#16213e;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
canvas{display:block}
#desc-panel{background:#16213e;border-radius:10px;padding:14px 20px;width:800px;margin-bottom:12px;min-height:70px;border-left:4px solid #e94560}
#desc-panel .step-num{color:#16c79a;font-weight:bold;font-size:1.1rem}
#desc-panel .formula{color:#e94560;font-family:'Courier New',monospace;font-size:1rem;margin-top:6px}
#desc-panel .explain{color:#b0b0b0;margin-top:4px;font-size:.9rem}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#0f3460;color:#e0e0e0;border:2px solid #e94560;border-radius:8px;padding:8px 18px;font-size:1rem;cursor:pointer;transition:all .2s}
button:hover{background:#e94560;color:#fff}
button:active{transform:scale(.95)}
#speed-label{color:#16c79a;font-size:.9rem}
#speed{width:80px;accent-color:#e94560}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>LeetCode 1072 - 按列翻转得到最大等值行数</h1>
<p class="subtitle">贪心 + 模式标准化 · 相同模式（或互补模式）的行可变为等值</p>
<div id="canvas-wrap"><canvas id="cv" width="800" height="540"></canvas></div>
<div id="desc-panel">
  <div class="step-num">步骤 0 / 0</div>
  <div class="formula"></div>
  <div class="explain">点击 ▶ 或步骤按钮开始动画</div>
</div>
<div id="controls">
  <button id="btn-reset">⏮ 重置</button>
  <button id="btn-prev">◀ 上一步</button>
  <button id="btn-play">▶ 播放</button>
  <button id="btn-next">▶ 下一步</button>
  <span id="speed-label">速度</span>
  <input type="range" id="speed" min="1" max="10" value="4">
</div>
<div class="legend">
  <span><span class="dot" style="background:#16c79a"></span>当前处理行</span>
  <span><span class="dot" style="background:#e94560"></span>标准化后翻转的位</span>
  <span><span class="dot" style="background:#533483"></span>相同模式行</span>
  <span><span class="dot" style="background:#0f3460"></span>原始矩阵</span>
</div>
<script>
const matrix=[[0,0,0],[0,1,1],[1,0,1]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=540;
let steps=[],curStep=-1,playing=false,playTimer=null;
const speedEl=document.getElementById('speed');
const patColors=['#e94560','#16c79a','#533483','#f0a500','#0f3460','#ff6b6b'];

function normalize(row){
  if(row[0]===0)return [...row];
  return row.map(v=>1-v);
}

function buildSteps(){
  steps=[];
  const patternCount={};
  const rowPatterns=[];

  steps.push({ri:-1,pattern:null,patternCount:{},rowPatterns:[],desc:'初始化',formula:'遍历每行，标准化模式后计数'});

  for(let i=0;i<matrix.length;i++){
    const row=matrix[i];
    const norm=normalize(row);
    const key=norm.join('');
    rowPatterns.push(key);

    if(!patternCount[key])patternCount[key]=0;
    patternCount[key]++;

    const flipped=row[0]===1;
    steps.push({ri:i,pattern:key,patternCount:{...patternCount},rowPatterns:[...rowPatterns],desc:`第${i}行标准化`,formula:`行${i}=[${row}] → row[0]=${row[0]}${flipped?' → 翻转':'（不变）'} → 标准模式=[${norm}] → 模式"${key}"出现${patternCount[key]}次`});
  }

  const maxCount=Math.max(...Object.values(patternCount));
  steps.push({ri:matrix.length,pattern:null,patternCount:{...patternCount},rowPatterns:[...rowPatterns],desc:'计算完毕',formula:`最大等值行数 = max(各模式计数) = ${maxCount}`});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const st=curStep>=0?steps[curStep]:null;
  const ri=st?st.ri:-1;
  const pc=st?st.patternCount:{};
  const rp=st?st.rowPatterns:[];

  const rows=matrix.length,cols=matrix[0].length;
  const cellW=60,cellH=44,gap=4;
  const matX=50,matY=50;

  // Title
  ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('原始矩阵',matX+cols*cellW/2,matY-15);

  // Draw original matrix
  for(let i=0;i<rows;i++){
    const row=matrix[i];
    const norm=normalize(row);
    const isFlipped=row[0]===1;
    for(let j=0;j<cols;j++){
      const x=matX+j*(cellW+gap),y=matY+i*(cellH+gap);
      let bg=row[j]===0?'#0f3460':'#533483';
      if(i===ri){
        if(isFlipped&&j>0)bg=row[j]===0?'#e9456055':'#e9456088';
        else bg=row[j]===0?'#16c79a44':'#16c79a88';
      }
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.roundRect(x,y,cellW,cellH,5);ctx.fill();
      ctx.strokeStyle=i===ri?'#16c79a':'#333';ctx.lineWidth=i===ri?2.5:1;ctx.stroke();
      ctx.fillStyle='#e0e0e0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
      ctx.fillText(row[j],x+cellW/2,y+cellH/2+6);
    }
    // row label
    ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText(`行${i}`,matX-8,matY+i*(cellH+gap)+cellH/2+4);
  }

  // Arrow to normalized
  const arrowX=matX+cols*(cellW+gap)+20;
  ctx.fillStyle='#e94560';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('标准化',arrowX+50,matY+rows*(cellH+gap)/2-10);
  ctx.fillText('row[0]=1则翻转',arrowX+50,matY+rows*(cellH+gap)/2+10);
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(arrowX-5,matY+rows*(cellH+gap)/2);ctx.lineTo(arrowX+100,matY+rows*(cellH+gap)/2);ctx.stroke();

  // Draw normalized matrix
  const normX=arrowX+120,normY=50;
  ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('标准化矩阵',normX+cols*cellW/2,normY-15);

  for(let i=0;i<rows;i++){
    const norm=normalize(matrix[i]);
    const key=norm.join('');
    // find pattern color
    const pKeys=Object.keys(pc);
    const pIdx=pKeys.indexOf(key);
    const pColor=pIdx>=0?patColors[pIdx%patColors.length]:'#533483';

    for(let j=0;j<cols;j++){
      const x=normX+j*(cellW+gap),y=normY+i*(cellH+gap);
      let bg=norm[j]===0?'#0f3460':'#533483';
      if(i===ri)bg=norm[j]===0?'#16c79a44':'#16c79a88';
      if(i<=ri||ri===matrix.length){
        bg=pColor+(norm[j]===0?'33':'55');
        if(i===ri)bg=pColor+'66';
      }
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.roundRect(x,y,cellW,cellH,5);ctx.fill();
      ctx.strokeStyle=i===ri?'#16c79a':pColor+'88';ctx.lineWidth=i===ri?2.5:1;ctx.stroke();
      ctx.fillStyle='#e0e0e0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
      ctx.fillText(norm[j],x+cellW/2,y+cellH/2+6);
    }
    // pattern label
    if(i<=ri||ri===matrix.length){
      const pKeys2=Object.keys(pc);
      const pIdx2=pKeys2.indexOf(key);
      ctx.fillStyle=pIdx2>=0?patColors[pIdx2%patColors.length]:'#888';
      ctx.font='bold 11px sans-serif';ctx.textAlign='left';
      ctx.fillText(`"${key}"`,normX+cols*(cellW+gap)+8,normY+i*(cellH+gap)+cellH/2+4);
    }
  }

  // Pattern count table
  const tblY=normY+rows*(cellH+gap)+40;
  ctx.fillStyle='#e0e0e0';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('模式计数:',normX,tblY);

  const pKeys=Object.keys(pc);
  for(let k=0;k<pKeys.length;k++){
    const x=normX+k*140;
    const y=tblY+12;
    ctx.fillStyle=patColors[k%patColors.length]+'88';
    ctx.beginPath();ctx.roundRect(x,y,120,50,6);ctx.fill();
    ctx.strokeStyle=patColors[k%patColors.length];ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#e0e0e0';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(`模式: "${pKeys[k]}"`,x+60,y+20);
    ctx.fillStyle='#16c79a';ctx.font='bold 16px sans-serif';
    ctx.fillText(`计数: ${pc[pKeys[k]]}`,x+60,y+42);
  }

  // Result
  if(pKeys.length>0){
    const maxCount=Math.max(...Object.values(pc));
    const resY=tblY+80;
    ctx.fillStyle='#16213e';ctx.fillRect(normX-20,resY,400,50);
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.strokeRect(normX-20,resY,400,50);
    ctx.fillStyle='#16c79a';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText(`最大等值行数 = ${maxCount}`,normX+180,resY+32);
  }
}

function updateDesc(){
  const panel=document.getElementById('desc-panel');
  if(curStep<0){panel.innerHTML=`<div class="step-num">步骤 0 / ${steps.length}</div><div class="explain">点击 ▶ 或步骤按钮开始动画</div>`;return;}
  const s=steps[curStep];
  panel.innerHTML=`<div class="step-num">步骤 ${curStep+1} / ${steps.length}</div><div class="formula">${s.formula}</div><div class="explain">${s.desc}</div>`;
}

function stepForward(){if(curStep<steps.length-1){curStep++;draw();updateDesc();}else stopPlay();}
function stepBack(){if(curStep>0){curStep--;draw();updateDesc();}else{curStep=-1;draw();updateDesc();}}
function startPlay(){if(playing)return;if(curStep>=steps.length-1)curStep=-1;playing=true;document.getElementById('btn-play').textContent='⏸ 暂停';tick();}
function tick(){if(!playing)return;stepForward();if(curStep>=steps.length-1){stopPlay();return;}playTimer=setTimeout(tick,1400/speedEl.value);}
function stopPlay(){playing=false;clearTimeout(playTimer);document.getElementById('btn-play').textContent='▶ 播放';}
function reset(){stopPlay();curStep=-1;draw();updateDesc();}

document.getElementById('btn-play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('btn-next').onclick=()=>{stopPlay();stepForward();};
document.getElementById('btn-prev').onclick=()=>{stopPlay();stepBack();};
document.getElementById('btn-reset').onclick=reset;

buildSteps();draw();updateDesc();
</script>
</body>
</html>
