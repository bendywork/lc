<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1925 - 统计平方和三元组的数目</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5em;margin-bottom:10px;color:#e94560}
#desc{font-size:.9em;color:#aaa;margin-bottom:15px;text-align:center;max-width:900px}
canvas{background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-bottom:10px}
#stepInfo{background:#16213e;border-radius:8px;padding:12px 20px;margin-bottom:10px;min-width:600px;border:1px solid #0f3460}
#stepInfo .stepNum{color:#16c79a;font-weight:bold}
#stepInfo .stepDesc{color:#ddd;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls button{background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:.95em;transition:all .2s}
.controls button:hover{background:#e94560;color:#fff}
#speed{width:60px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;padding:4px 6px}
.legend{display:flex;gap:18px;margin-top:8px;font-size:.85em;color:#aaa;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>1925 - 统计平方和三元组的数目</h1>
<p id="desc">给定正整数n，统计满足a²+b²=c²且1≤a,b,c≤n的三元组(a,b,c)的数目（顺序不同算不同三元组，如(3,4,5)和(4,3,5)算两个）。</p>
<canvas id="cv" width="900" height="540"></canvas>
<div id="stepInfo"><span class="stepNum">步骤 0/0</span><div class="stepDesc">点击「播放」或「步骤前进」开始演示</div></div>
<div class="controls">
<button onclick="reset()">⏮ 重置</button>
<button onclick="prevStep()">◀ 步骤后退</button>
<button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button onclick="nextStep()">步骤前进 ▶</button>
<label style="color:#aaa">速度:<input id="speed" type="number" value="400" min="100" max="3000" step="100">ms</label>
</div>
<div class="legend">
<span><span class="dot" style="background:#16c79a"></span>当前(a,b)</span>
<span><span class="dot" style="background:#ffd700"></span>命中 a²+b²=c²</span>
<span><span class="dot" style="background:#e94560"></span>不满足</span>
<span><span class="dot" style="background:#1a8fdd"></span>计算区域</span>
</div>
<script>
const n=10;
const steps=[];
function buildSteps(){
  steps.length=0;
  let count=0;
  const found=[];
  steps.push({a:-1,b:-1,c:-1,a2:0,b2:0,c2:0,count:0,found:[],action:'init',desc:`初始化：n=${n}，遍历所有 a∈[1,${n}], b∈[1,${n}]`});
  const squares=new Set();
  for(let i=1;i<=n;i++)squares.add(i*i);
  for(let a=1;a<=n;a++){
    for(let b=1;b<=n;b++){
      const a2=a*a,b2=b*b,sum=a2+b2;
      const c=Math.sqrt(sum);
      const isInteger=c===Math.floor(c)&&c>=1&&c<=n;
      if(isInteger){
        count++;
        found.push({a,b,c:c});
        steps.push({a,b,c:c,a2,b2,c2:c*c,count,found:[...found],action:'found',desc:`✓ ${a}²+${b}²=${a2}+${b2}=${sum}=${c}²，(${a},${b},${c}) 是三元组！count=${count}`});
      }else{
        const extra=sum>n*n?' > '+n+'²':'，√'+sum+'='+Math.sqrt(sum).toFixed(2)+'非整数';
        steps.push({a,b,c:-1,a2,b2,c2:0,count,found:[...found],action:'miss',desc:`${a}²+${b}²=${a2}+${b2}=${sum}${extra}`});
      }
    }
  }
  steps.push({a:-1,b:-1,c:-1,a2:0,b2:0,c2:0,count,found,action:'done',desc:`遍历结束！共找到 ${count} 个平方和三元组`,final:true});
}
buildSteps();

let cur=-1,timer=null,playing=false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const gridSize=30;
const gridOffX=40,gridOffY=50;

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=cur<0?{a:-1,b:-1,c:-1,count:0,found:[],action:'init'}:steps[cur];
  // draw grid
  ctx.fillStyle='#aaa';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText('a \\ b',gridOffX+gridSize/2,gridOffY-8);
  for(let a=1;a<=n;a++){
    ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(a,gridOffX+gridSize/2,gridOffY+a*gridSize+gridSize/2+4);
  }
  for(let b=1;b<=n;b++){
    ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(b,gridOffX+b*gridSize+gridSize/2,gridOffY+gridSize/2+4);
  }
  // draw cells
  for(let a=1;a<=n;a++){
    for(let b=1;b<=n;b++){
      const x=gridOffX+b*gridSize;
      const y=gridOffY+a*gridSize;
      let bg='#2a2a4a';
      // found cells
      const isFound=s.found.some(f=>f.a===a&&f.b===b);
      if(isFound)bg='#4a4a1a';
      // current cell
      if(s.a===a&&s.b===b){
        bg=s.action==='found'?'#ffd700':'#16c79a';
      }
      ctx.fillStyle=bg;
      ctx.fillRect(x,y,gridSize,gridSize);
      ctx.strokeStyle='#0f3460';ctx.lineWidth=1;
      ctx.strokeRect(x,y,gridSize,gridSize);
    }
  }
  // found triples list
  const listX=420,listY=50;
  ctx.fillStyle='#16c79a';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText('已发现的三元组:',listX,listY);
  const displayFound=s.found.slice(-12);
  for(let i=0;i<displayFound.length;i++){
    const f=displayFound[i];
    const fy=listY+20+i*22;
    ctx.fillStyle=i===displayFound.length-1&&s.action==='found'?'#ffd700':'#16c79a';
    ctx.font='13px sans-serif';ctx.textAlign='left';
    ctx.fillText(`(${f.a}, ${f.b}, ${f.c})  →  ${f.a}²+${f.b}²=${f.c}²`,listX,fy);
  }
  // current calculation detail
  if(s.a>=0&&s.b>=0){
    const detailY=350;
    ctx.fillStyle='#1a8fdd';ctx.font='bold 16px sans-serif';ctx.textAlign='left';
    ctx.fillText(`当前: a=${s.a}, b=${s.b}`,listX,detailY);
    ctx.fillStyle='#eee';ctx.font='14px sans-serif';
    ctx.fillText(`${s.a}² + ${s.b}² = ${s.a2} + ${s.b2} = ${s.a2+s.b2}`,listX,detailY+25);
    if(s.action==='found'){
      ctx.fillStyle='#ffd700';ctx.font='bold 14px sans-serif';
      ctx.fillText(`= ${s.c}² ✓ 满足条件!`,listX,detailY+50);
    }else if(s.action==='miss'){
      ctx.fillStyle='#e94560';ctx.font='14px sans-serif';
      ctx.fillText(`= ${s.a2+s.b2}，不是完全平方数 ✗`,listX,detailY+50);
    }
    // visual triangle
    const triX=700,triY=370;
    const scale=15;
    const ca=s.a*scale,cb=s.b*scale;
    ctx.strokeStyle='#1a8fdd';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(triX,triY);ctx.lineTo(triX+cb,triY);ctx.lineTo(triX,triY-ca);ctx.closePath();ctx.stroke();
    ctx.fillStyle='#16c79a';ctx.font='12px sans-serif';
    ctx.fillText('a='+s.a,triX-5,triY-ca/2);
    ctx.fillText('b='+s.b,triX+cb/2,triY+15);
    if(s.action==='found'){
      ctx.fillStyle='#ffd700';
      ctx.fillText('c='+s.c,triX+cb/2+10,triY-ca/2-10);
    }
  }
  // count
  ctx.fillStyle='#ffd700';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText('计数: '+s.count,W/2,H-30);
}

function updateInfo(){
  const s=cur<0?null:steps[cur];
  document.querySelector('#stepInfo .stepNum').textContent=`步骤 ${cur+1}/${steps.length}`;
  document.querySelector('#stepInfo .stepDesc').textContent=s?s.desc:'点击「播放」或「步骤前进」开始演示';
}
function nextStep(){if(cur<steps.length-1){cur++;draw();updateInfo();}else stopPlay();}
function prevStep(){if(cur>=0){cur--;draw();updateInfo();}}
function reset(){stopPlay();cur=-1;draw();updateInfo();}
function togglePlay(){if(playing)stopPlay();else startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return;}nextStep();},+document.getElementById('speed').value);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}

draw();updateInfo();
</script>
</body>
</html>
