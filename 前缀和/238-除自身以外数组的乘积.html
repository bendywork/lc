<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>238 - 除自身以外数组的乘积</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5em;margin-bottom:10px;color:#e94560}
#desc{font-size:.9em;color:#aaa;margin-bottom:15px;text-align:center;max-width:900px}
canvas{background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-bottom:10px}
#stepInfo{background:#16213e;border-radius:8px;padding:12px 20px;margin-bottom:10px;min-width:600px;border:1px solid #0f3460}
#stepInfo .stepNum{color:#16c79a;font-weight:bold}
#stepInfo .stepDesc{color:#ddd;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls button{background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:.95em;transition:all .2s}
.controls button:hover{background:#e94560;color:#fff}
#speed{width:60px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;padding:4px 6px}
.legend{display:flex;gap:18px;margin-top:8px;font-size:.85em;color:#aaa;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>238 - 除自身以外数组的乘积</h1>
<p id="desc">给定数组nums，返回数组answer，其中answer[i]等于nums中除nums[i]外其余各元素乘积。左右两次遍历：先左到右算前缀乘积，再右到左算后缀乘积，最终相乘。</p>
<canvas id="cv" width="900" height="500"></canvas>
<div id="stepInfo"><span class="stepNum">步骤 0/0</span><div class="stepDesc">点击「播放」或「步骤前进」开始演示</div></div>
<div class="controls">
<button onclick="reset()">⏮ 重置</button>
<button onclick="prevStep()">◀ 步骤后退</button>
<button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button onclick="nextStep()">步骤前进 ▶</button>
<label style="color:#aaa">速度:<input id="speed" type="number" value="1000" min="100" max="3000" step="100">ms</label>
</div>
<div class="legend">
<span><span class="dot" style="background:#e94560"></span>原始数组</span>
<span><span class="dot" style="background:#1a8fdd"></span>左乘积(前缀)</span>
<span><span class="dot" style="background:#16c79a"></span>右乘积(后缀)</span>
<span><span class="dot" style="background:#ffd700"></span>最终结果</span>
</div>
<script>
const nums=[1,2,3,4];
const steps=[];
function buildSteps(){
  steps.length=0;
  const n=nums.length;
  const prefix=new Array(n).fill(1);
  const suffix=new Array(n).fill(1);
  const res=new Array(n).fill(1);
  steps.push({phase:'init',idx:-1,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:'初始化：prefix和suffix全为1，res全为1'});
  // left to right
  steps.push({phase:'left-start',idx:-1,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:'阶段1：从左到右计算前缀乘积 prefix[i] = prefix[i-1] × nums[i-1]'});
  for(let i=1;i<n;i++){
    prefix[i]=prefix[i-1]*nums[i-1];
    steps.push({phase:'left',idx:i,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:`prefix[${i}] = prefix[${i-1}] × nums[${i-1}] = ${prefix[i-1]} × ${nums[i-1]} = ${prefix[i]}`});
  }
  // right to left
  steps.push({phase:'right-start',idx:-1,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:'阶段2：从右到左计算后缀乘积 suffix[i] = suffix[i+1] × nums[i+1]'});
  for(let i=n-2;i>=0;i--){
    suffix[i]=suffix[i+1]*nums[i+1];
    steps.push({phase:'right',idx:i,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:`suffix[${i}] = suffix[${i+1}] × nums[${i+1}] = ${suffix[i+1]} × ${nums[i+1]} = ${suffix[i]}`});
  }
  // combine
  steps.push({phase:'combine-start',idx:-1,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:'阶段3：组合结果 res[i] = prefix[i] × suffix[i]'});
  for(let i=0;i<n;i++){
    res[i]=prefix[i]*suffix[i];
    steps.push({phase:'combine',idx:i,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:`res[${i}] = prefix[${i}] × suffix[${i}] = ${prefix[i]} × ${suffix[i]} = ${res[i]}`});
  }
  steps.push({phase:'done',idx:-1,prefix:[...prefix],suffix:[...suffix],res:[...res],desc:`完成！结果数组 = [${res.join(', ')}]`,final:true});
}
buildSteps();

let cur=-1,timer=null,playing=false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const cellW=100,gap=20,totalW=nums.length*(cellW+gap)-gap;
const offsetX=(W-totalW)/2;

function drawRow(y,label,arr,highlightIdx,highlightColor,showArrow,arrowDir){
  ctx.fillStyle='#aaa';ctx.font='bold 14px sans-serif';ctx.textAlign='right';
  ctx.fillText(label,offsetX-10,y+16);
  for(let i=0;i<arr.length;i++){
    const x=offsetX+i*(cellW+gap);
    let bg='#2a2a4a';
    if(i===highlightIdx)bg=highlightColor||'#16c79a';
    ctx.fillStyle=bg;
    ctx.fillRect(x,y,cellW,32);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW,32);
    ctx.fillStyle='#eee';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(arr[i],x+cellW/2,y+22);
    // index
    ctx.fillStyle='#666';ctx.font='11px sans-serif';
    ctx.fillText('['+i+']',x+cellW/2,y+46);
  }
  // arrow
  if(showArrow&&highlightIdx>=0){
    const ax=offsetX+highlightIdx*(cellW+gap)+cellW/2;
    const ay=arrowDir==='down'?y-8:y+40;
    ctx.fillStyle=highlightColor||'#16c79a';
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-6,ay+(arrowDir==='down'?-10:10));ctx.lineTo(ax+6,ay+(arrowDir==='down'?-10:10));ctx.closePath();ctx.fill();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=cur<0?{phase:'init',idx:-1,prefix:new Array(nums.length).fill(1),suffix:new Array(nums.length).fill(1),res:new Array(nums.length).fill(1)}:steps[cur];
  const rows=[
    {label:'nums',arr:nums,y:40,hi:-1,hc:null},
    {label:'prefix',arr:s.prefix,y:130,hi:s.phase==='left'?s.idx:-1,hc:'#1a8fdd'},
    {label:'suffix',arr:s.suffix,y:220,hi:s.phase==='right'?s.idx:-1,hc:'#16c79a'},
    {label:'res',arr:s.res,y:310,hi:s.phase==='combine'?s.idx:-1,hc:'#ffd700'},
  ];
  for(const r of rows){
    drawRow(r.y,r.label,r.arr,r.hi,r.hc,r.hi>=0,r.hi>=0?(r.label==='prefix'?'down':'down'):'down');
  }
  // phase indicator
  let phaseText='';
  if(s.phase==='init')phaseText='初始化';
  else if(s.phase==='left-start'||s.phase==='left')phaseText='阶段1: 左→右 前缀乘积';
  else if(s.phase==='right-start'||s.phase==='right')phaseText='阶段2: 右→左 后缀乘积';
  else if(s.phase==='combine-start'||s.phase==='combine')phaseText='阶段3: 组合结果';
  else if(s.phase==='done')phaseText='完成!';
  ctx.fillStyle='#e94560';ctx.font='bold 16px sans-serif';ctx.textAlign='left';
  ctx.fillText(phaseText,30,H-40);
  // formula
  if(s.phase==='left'&&s.idx>0){
    ctx.fillStyle='#1a8fdd';ctx.font='13px sans-serif';ctx.textAlign='left';
    ctx.fillText(`prefix[${s.idx}] = prefix[${s.idx-1}] × nums[${s.idx-1}] = ${s.prefix[s.idx-1]} × ${nums[s.idx-1]} = ${s.prefix[s.idx]}`,30,H-18);
  }else if(s.phase==='right'&&s.idx>=0){
    ctx.fillStyle='#16c79a';ctx.font='13px sans-serif';ctx.textAlign='left';
    ctx.fillText(`suffix[${s.idx}] = suffix[${s.idx+1}] × nums[${s.idx+1}] = ${s.suffix[s.idx+1]} × ${nums[s.idx+1]} = ${s.suffix[s.idx]}`,30,H-18);
  }else if(s.phase==='combine'){
    ctx.fillStyle='#ffd700';ctx.font='13px sans-serif';ctx.textAlign='left';
    ctx.fillText(`res[${s.idx}] = prefix[${s.idx}] × suffix[${s.idx}] = ${s.prefix[s.idx]} × ${s.suffix[s.idx]} = ${s.res[s.idx]}`,30,H-18);
  }
}

function updateInfo(){
  const s=cur<0?null:steps[cur];
  document.querySelector('#stepInfo .stepNum').textContent=`步骤 ${cur+1}/${steps.length}`;
  document.querySelector('#stepInfo .stepDesc').textContent=s?s.desc:'点击「播放」或「步骤前进」开始演示';
}
function nextStep(){if(cur<steps.length-1){cur++;draw();updateInfo();}else stopPlay();}
function prevStep(){if(cur>=0){cur--;draw();updateInfo();}}
function reset(){stopPlay();cur=-1;draw();updateInfo();}
function togglePlay(){if(playing)stopPlay();else startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return;}nextStep();},+document.getElementById('speed').value);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}

draw();updateInfo();
</script>
</body>
</html>
