<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3432 - 统计分割数</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5em;margin-bottom:10px;color:#e94560}
#desc{font-size:.9em;color:#aaa;margin-bottom:15px;text-align:center;max-width:900px}
canvas{background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-bottom:10px}
#stepInfo{background:#16213e;border-radius:8px;padding:12px 20px;margin-bottom:10px;min-width:600px;border:1px solid #0f3460}
#stepInfo .stepNum{color:#16c79a;font-weight:bold}
#stepInfo .stepDesc{color:#ddd;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls button{background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:.95em;transition:all .2s}
.controls button:hover{background:#e94560;color:#fff}
#speed{width:60px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;padding:4px 6px}
.legend{display:flex;gap:18px;margin-top:8px;font-size:.85em;color:#aaa;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>3432 - 统计分割数</h1>
<p id="desc">给定数组nums，统计将数组分成左右两部分（均非空），使得左右和之差为偶数的分割点个数。</p>
<canvas id="cv" width="900" height="480"></canvas>
<div id="stepInfo"><span class="stepNum">步骤 0/0</span><div class="stepDesc">点击「播放」或「步骤前进」开始演示</div></div>
<div class="controls">
<button onclick="reset()">⏮ 重置</button>
<button onclick="prevStep()">◀ 步骤后退</button>
<button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
<button onclick="nextStep()">步骤前进 ▶</button>
<label style="color:#aaa">速度:<input id="speed" type="number" value="1000" min="100" max="3000" step="100">ms</label>
</div>
<div class="legend">
<span><span class="dot" style="background:#1a8fdd"></span>左侧区域</span>
<span><span class="dot" style="background:#16c79a"></span>右侧区域</span>
<span><span class="dot" style="background:#ffd700"></span>有效分割</span>
<span><span class="dot" style="background:#e94560"></span>当前分割点</span>
</div>
<script>
const nums=[10,10,3,10,10];
const steps=[];
function buildSteps(){
  steps.length=0;
  const n=nums.length;
  const total=nums.reduce((a,b)=>a+b,0);
  let leftSum=0,count=0;
  const pf=[0];
  steps.push({splitAt:-1,leftSum:0,rightSum:total,count:0,desc:`初始化：总和=${total}，leftSum=0，count=0`});
  for(let i=0;i<n-1;i++){
    leftSum+=nums[i];
    const rightSum=total-leftSum;
    const diff=rightSum-leftSum;
    const valid=(diff%2===0);
    if(valid)count++;
    steps.push({splitAt:i,leftSum,rightSum,count,desc:`分割点 i=${i}：leftSum=${leftSum}，rightSum=${rightSum}，差=right-left=${diff}，${valid?'偶数 ✓ count='+count:'奇数 ✗'}`,valid});
  }
  steps.push({splitAt:-1,leftSum:0,rightSum:total,count,desc:`遍历结束！有效分割数 = ${count}`,final:true});
}
buildSteps();

let cur=-1,timer=null,playing=false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const cellW=90,gap=15,totalW=nums.length*(cellW+gap)-gap;
const offsetX=(W-totalW)/2;

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=cur<0?{splitAt:-1,leftSum:0,rightSum:nums.reduce((a,b)=>a+b,0),count:0,valid:false}:steps[cur];
  const baseY=80;
  // draw cells
  for(let i=0;i<nums.length;i++){
    const x=offsetX+i*(cellW+gap);
    let bg='#2a2a4a';
    if(s.splitAt>=0&&i<=s.splitAt)bg='#1a3a5a';
    if(s.splitAt>=0&&i>s.splitAt)bg='#1a4a3a';
    if(s.splitAt===i)bg='#e94560';
    ctx.fillStyle=bg;
    ctx.fillRect(x,baseY,cellW,40);
    ctx.strokeStyle='#0f3460';ctx.lineWidth=1;ctx.strokeRect(x,baseY,cellW,40);
    ctx.fillStyle='#eee';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText(nums[i],x+cellW/2,baseY+26);
    ctx.fillStyle='#888';ctx.font='11px sans-serif';
    ctx.fillText('['+i+']',x+cellW/2,baseY+56);
  }
  // split line
  if(s.splitAt>=0&&!s.final){
    const splitX=offsetX+s.splitAt*(cellW+gap)+cellW+gap/2;
    ctx.strokeStyle='#e94560';ctx.lineWidth=3;ctx.setLineDash([6,3]);
    ctx.beginPath();ctx.moveTo(splitX,baseY-10);ctx.lineTo(splitX,baseY+70);ctx.stroke();
    ctx.setLineDash([]);
  }
  // left/right sum display
  const dispY=200;
  if(s.splitAt>=0&&!s.final){
    // left sum box
    ctx.fillStyle='#1a3a5a';ctx.fillRect(offsetX,dispY,200,50);
    ctx.strokeStyle='#1a8fdd';ctx.lineWidth=2;ctx.strokeRect(offsetX,dispY,200,50);
    ctx.fillStyle='#1a8fdd';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText('左侧和 = '+s.leftSum,offsetX+100,dispY+32);

    // right sum box
    const rx=offsetX+250;
    ctx.fillStyle='#1a4a3a';ctx.fillRect(rx,dispY,200,50);
    ctx.strokeStyle='#16c79a';ctx.lineWidth=2;ctx.strokeRect(rx,dispY,200,50);
    ctx.fillStyle='#16c79a';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText('右侧和 = '+s.rightSum,rx+100,dispY+32);

    // diff
    const diff=s.rightSum-s.leftSum;
    ctx.fillStyle=diff%2===0?'#ffd700':'#e94560';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('差 = '+diff+' '+(diff%2===0?'(偶数 ✓)':'(奇数 ✗)'),W/2,dispY+100);
  }
  // count
  ctx.fillStyle='#ffd700';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText('有效分割数: '+s.count,W/2,H-50);
  // total
  ctx.fillStyle='#aaa';ctx.font='14px sans-serif';ctx.textAlign='center';
  ctx.fillText('数组总和 = '+nums.reduce((a,b)=>a+b,0),W/2,H-25);
}

function updateInfo(){
  const s=cur<0?null:steps[cur];
  document.querySelector('#stepInfo .stepNum').textContent=`步骤 ${cur+1}/${steps.length}`;
  document.querySelector('#stepInfo .stepDesc').textContent=s?s.desc:'点击「播放」或「步骤前进」开始演示';
}
function nextStep(){if(cur<steps.length-1){cur++;draw();updateInfo();}else stopPlay();}
function prevStep(){if(cur>=0){cur--;draw();updateInfo();}}
function reset(){stopPlay();cur=-1;draw();updateInfo();}
function togglePlay(){if(playing)stopPlay();else startPlay();}
function startPlay(){playing=true;document.getElementById('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length-1){stopPlay();return;}nextStep();},+document.getElementById('speed').value);}
function stopPlay(){playing=false;document.getElementById('btnPlay').textContent='▶ 播放';clearInterval(timer);timer=null;}

draw();updateInfo();
</script>
</body>
</html>
